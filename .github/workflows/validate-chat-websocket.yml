name: Validate chat WebSocket feature branches (no deploy)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-chat-websocket.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: >-
      github.repository == 'coderats-hub/coderats-deploy' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, 'ci(chat): validate websocket'))
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            repository: web-coderats-base
          - service: web-baseline
            repository: web-coderats-base
            ref: develop
          - service: api
            repository: api-coderats-base
    steps:
      - name: Obtain private-source read-only token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          owner: coderats-hub
          repositories: ${{ matrix.repository }}
          permission-contents: read

      - name: Checkout reviewed feature branch
        uses: actions/checkout@v4
        with:
          repository: coderats-hub/${{ matrix.repository }}
          ref: ${{ matrix.ref || 'feature/chat-websocket-realtime-20261029' }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
          path: source

      - name: Prepare Node
        if: matrix.service != 'api'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare Java
        if: matrix.service == 'api'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify frontend tests, TypeScript and production build independently
        if: matrix.service != 'api'
        working-directory: source
        env:
          NEXT_PUBLIC_API_URL: https://coderats.club
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/chat-install.log" 2>&1
          failed=0
          if npm test -- --reporter=json --outputFile="$RUNNER_TEMP/chat-tests.json" > "$RUNNER_TEMP/chat-tests.log" 2>&1; then
            echo "Vitest: PASS"
          else
            failed=1
            python3 - <<'PY'
          import pathlib, json, os
          p=pathlib.Path(os.environ["RUNNER_TEMP"],"chat-tests.json")
          if not p.exists():
              print("Vitest: failed before JSON report could be emitted")
          else:
              d=json.loads(p.read_text(errors="replace"))
              print("Vitest: FAIL; failed tests:",d.get("numFailedTests"),"failed suites:",d.get("numFailedTestSuites"))
              print("Failed suite basenames:",
                [pathlib.PurePath(x.get("name","")).name for x in d.get("testResults",[]) if x.get("status")=="failed"][:25])
          PY
          fi
          if npx tsc --noEmit > "$RUNNER_TEMP/chat-tsc.log" 2>&1; then
            echo "TypeScript: PASS"
          else
            failed=1
            python3 - <<'PY'
          import pathlib,os,re
          s=pathlib.Path(os.environ["RUNNER_TEMP"],"chat-tsc.log").read_text(errors="replace")
          print("TypeScript: FAIL", sorted(set(re.findall(r"TS\d+",s)))[:25])
          print("Compiler locations:", sorted(set(re.findall(r"[\w.-]+\.tsx?\(\d+,\d+\)",s)))[:30])
          PY
          fi
          if npm run build -- --webpack > "$RUNNER_TEMP/chat-build.log" 2>&1; then
            echo "Next.js build: PASS"
          else
            failed=1
            python3 - <<'PY'
          import pathlib,re,os
          s=pathlib.Path(os.environ["RUNNER_TEMP"],"chat-build.log").read_text(errors="replace")
          print("Next.js build: FAIL; TypeScript codes:", sorted(set(re.findall(r"TS\d+",s)))[:25])
          print("Compiler locations:", sorted(set(re.findall(r"[\w.-]+\.tsx?\(\d+,\d+\)",s)))[:25])
          PY
          fi
          exit "$failed"

      - name: Verify API tests and compilation
        if: matrix.service == 'api'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          if ! ./mvnw --batch-mode verify > "$RUNNER_TEMP/chat-validation.log" 2>&1; then
            python3 - <<'PY'
          import pathlib,re,os
          s=pathlib.Path(os.environ["RUNNER_TEMP"],"chat-validation.log").read_text(errors="replace")
          print("API Maven verify failed. Sanitized compiler locations:")
          print(sorted(set(re.findall(r'[A-Za-z0-9_]+\.java:\[\d+,\d+\]',s)))[:30])
          print("Compilation error:", "COMPILATION ERROR" in s)
          print("Failed test classes:", sorted(set(re.findall(r'-- in [A-Za-z0-9_.$]+',s)))[:15])
          print("Full private Maven log intentionally suppressed.")
          PY
            exit 1
          fi
          echo "API Maven verify passed."

      - name: Wipe checked-out private source
        if: always()
        shell: bash
        run: rm -rf source
