# One-off approved operation: copy official Grader revision and bind an existing
# Azure Container App secret. Never read or print secret VALUES or raw app config.
name: Refresh official Grader OpenAI secret binding
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-official-grader-openai-secret.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: coderats-grader-dev-release
  cancel-in-progress: false
jobs:
  bind-openai:
    if: >-
      github.repository == 'coderats-hub/coderats-deploy' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'ci(migration): refresh grader openai secret')
    runs-on: ubuntu-latest
    environment: migration-target
    timeout-minutes: 20
    steps:
      - name: Sign in to official Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Rebind existing OpenAI secret in a fresh Grader revision
        shell: bash
        env:
          EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          rg=rg-coderats-migration-c26m0911
          app=ca-cdmstd-grader-c26m0911
          registry=crcoderatsmigc26m0911.azurecr.io
          if [[ "$EXPECTED_SUBSCRIPTION" != "da3650a9-e291-43f1-ae4b-9dcc8ff84239" ||
                "$(az account show --query id -o tsv)" != "$EXPECTED_SUBSCRIPTION" ]]; then
            echo "::error::Refusing to modify an unexpected Azure subscription."
            exit 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if ! az containerapp show -g "$rg" -n "$app" -o json > "$tmp/before.json" 2>"$tmp/error"; then
            echo "::error::Unable to inspect the official Grader Container App."
            exit 1
          fi
          python3 - "$tmp/before.json" "$app" "$registry" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding="utf-8"))
          p=data.get("properties") or {}
          cfg=p.get("configuration") or {}
          template=p.get("template") or {}
          cs=template.get("containers") or []
          image=str(cs[0].get("image","")) if len(cs)==1 else ""
          checks=[
              data.get("name")==sys.argv[2],
              cfg.get("ingress",{}).get("external") is False,
              str(cfg.get("activeRevisionsMode","")).lower()=="single",
              image.startswith(sys.argv[3]+"/api-grader-coderats:") or image.startswith(sys.argv[3]+"/api-grader-coderats@sha256:"),
              bool(p.get("latestReadyRevisionName")),
              p.get("latestReadyRevisionName")==p.get("latestRevisionName"),
          ]
          if not all(checks):
              print("::error::Grader destination, private ingress, revision mode or readiness guard failed.")
              sys.exit(1)
          print("Preflight: official Grader ready; private ingress; current image preserved.")
          PY
          # Azure CLI receives a secret list internally; only NAMES are selected in
          # query output, and even those never appear in public workflow logs.
          if ! az containerapp secret list -g "$rg" -n "$app" --query "[].name" -o tsv >"$tmp/secret-names" 2>"$tmp/error"; then
            echo "::error::Cannot inspect official Grader secret names (no changes made)."
            exit 1
          fi
          secret_name=""
          for candidate in openai-api-key openai-key openaiapikey; do
            if grep -Fxq "$candidate" "$tmp/secret-names"; then
              secret_name="$candidate"
              break
            fi
          done
          if [[ -z "$secret_name" ]]; then
            echo "::error::No recognized existing OpenAI API secret found in Grader. Expected name: openai-api-key. No revision changed."
            exit 1
          fi
          before="$(az containerapp show -g "$rg" -n "$app" --query properties.latestReadyRevisionName -o tsv)"
          # Always create a *new* revision, even when an earlier one already had
          # a secret reference: this refreshes newly rotated secret contents.
          # Revision copy keeps the same image/limits/scale/env except this binding.
          if ! az containerapp revision copy -g "$rg" -n "$app" \
              --from-revision "$before" \
              --set-env-vars "OPENAI_API_KEY=secretref:$secret_name" \
              --revision-suffix "openai-$GITHUB_RUN_ID" \
              --only-show-errors -o none > "$tmp/copy.out" 2>"$tmp/error"; then
            echo "::error::Grader revision copy failed. Private CLI diagnostic suppressed."
            exit 1
          fi
          ready=""
          for i in $(seq 1 45); do
            if ! az containerapp show -g "$rg" -n "$app" -o json >"$tmp/after.json" 2>"$tmp/error"; then
              sleep 10
              continue
            fi
            if python3 - "$tmp/before.json" "$tmp/after.json" "$secret_name" <<'PY'
          import json,sys
          before=json.load(open(sys.argv[1],encoding="utf-8"))["properties"]
          after=json.load(open(sys.argv[2],encoding="utf-8"))["properties"]
          b=before["template"]["containers"][0]
          a=after["template"]["containers"][0]
          after_env={i["name"]:i for i in a.get("env",[])}
          before_env={i["name"]:i for i in b.get("env",[])}
          unchanged=all(after_env.get(k)==v for k,v in before_env.items() if k!="OPENAI_API_KEY")
          checks=[
              after.get("latestRevisionName")!=before.get("latestRevisionName"),
              after.get("latestRevisionName")==after.get("latestReadyRevisionName"),
              a.get("image")==b.get("image"),
              len(after["template"].get("containers",[]))==len(before["template"].get("containers",[])),
              unchanged,
              after_env.get("OPENAI_API_KEY",{}).get("secretRef")==sys.argv[3],
          ]
          sys.exit(0 if all(checks) else 1)
          PY
            then
              ready="$(az containerapp show -g "$rg" -n "$app" --query properties.latestReadyRevisionName -o tsv)"
              break
            fi
            sleep 10
          done
          if [[ -z "$ready" ]]; then
            echo "::error::Grader secret-binding revision did not become ready with expected unchanged image and environment."
            exit 1
          fi
          {
            echo "Official Grader: revision ready"
            echo "Revision: $ready"
            echo "OPENAI_API_KEY: reference to an existing Azure secret confirmed"
            echo "Image unchanged; no API/Web resource or other environment variables changed."
            echo "AI inference itself was not tested; a fresh check-in is needed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Revoke Azure login
        if: always()
        shell: bash
        run: az logout >/dev/null 2>&1 || true
