name: Recover CodeRats migration-target Web only (isolated, one-time)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_MIGRATION_WEB to permit isolated destination-only Web recovery"
        required: true
        type: string
  push:
    branches: [main]
    paths: [".github/workflows/deploy-migration-target-web-recovery.yml"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: coderats-migration-target-web-recovery
  cancel-in-progress: false

jobs:
  web-recovery:
    if: >-
      github.repository == 'coderats-hub/coderats-deploy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY_MIGRATION_WEB') ||
       (github.event_name == 'push' &&
        startsWith(github.event.head_commit.message, 'ci(migration): recover isolated mirror web')))
    runs-on: ubuntu-latest
    environment: migration-target
    timeout-minutes: 40
    env:
      SID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TID: ${{ secrets.AZURE_TENANT_ID }}
      RG: rg-coderats-migration-c26m0911
      ACR: crcoderatsmigc26m0911
      CAE: cae-coderatsmig-c26m0911
      WEB: ca-coderatsmig-web-c26m0911
      API: ca-coderatsmig-api-c26m0911
      GRADER: ca-coderatsmig-grader-c26m0911
      ACR_WEB_TOKEN: coderats-mirror-web-pull
    steps:
      - name: Log in only to the authorized target Azure subscription
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify subscription, image dependencies, existing apps and isolated default domain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SID" == "da3650a9-e291-43f1-ae4b-9dcc8ff84239" ]]
          [[ "$TID" == "1cf74c7e-fcd9-46f7-8a9d-e699d3529003" ]]
          [[ "$(az account show --query id -o tsv)" == "$SID" ]]
          [[ "$(az account show --query tenantId -o tsv)" == "$TID" ]]
          [[ "$(az acr show -g "$RG" -n "$ACR" --subscription "$SID" --query name -o tsv --only-show-errors)" == "$ACR" ]]
          for app in "$GRADER" "$API"; do
            [[ "$(az containerapp show -g "$RG" -n "$app" --subscription "$SID" --query properties.runningStatus -o tsv --only-show-errors)" == "Running" ]] || {
              echo "::error::Existing target API or Grader is not Running. No Web resources changed."
              exit 1
            }
          done
          domain="$(az containerapp env show -g "$RG" -n "$CAE" --subscription "$SID" --query properties.defaultDomain -o tsv --only-show-errors)"
          [[ "$domain" == *.azurecontainerapps.io ]]
          echo "MIRROR_WEB_ORIGIN=https://$WEB.$domain" >> "$GITHUB_ENV"
          echo "Target-only prerequisites confirmed. No original DEV connection."

      - name: Check if Web already exists before changing anything
        shell: bash
        run: |
          set -euo pipefail
          if az containerapp show -g "$RG" -n "$WEB" --subscription "$SID" --query name -o tsv --only-show-errors >/dev/null 2>&1; then
            echo "WEB_EXISTS=true" >> "$GITHUB_ENV"
            echo "Existing target Web resource detected: creation will be skipped."
          else
            echo "WEB_EXISTS=false" >> "$GITHUB_ENV"
            echo "Target Web resource is absent: will create without ingress first."
          fi

      - name: Prepare separate read-only ACR token without rotating API or Grader credentials
        if: env.WEB_EXISTS == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if ! az acr token show --registry "$ACR" --name "$ACR_WEB_TOKEN" --subscription "$SID" \
            --query name -o tsv --only-show-errors >/dev/null 2>&1; then
            az acr token create --registry "$ACR" --name "$ACR_WEB_TOKEN" \
              --scope-map _repositories_pull --subscription "$SID" --only-show-errors -o none
          fi
          az acr token update --registry "$ACR" --name "$ACR_WEB_TOKEN" --status enabled \
            --subscription "$SID" --only-show-errors -o none
          pullpass="$(az acr token credential generate --registry "$ACR" --name "$ACR_WEB_TOKEN" \
            --password1 --expiration-in-days 30 --subscription "$SID" \
            --query 'passwords[0].value' -o tsv --only-show-errors)"
          [[ -n "$pullpass" ]]
          echo "::add-mask::$pullpass"
          echo "WEB_ACR_PULL_PASSWORD=$pullpass" >> "$GITHUB_ENV"
          unset pullpass
          echo "Web-only scoped pull credential created; existing API/Grader registry tokens untouched."

      - name: Stage 1 - create minimal Web resource with public bootstrap image and no identity or ingress
        if: env.WEB_EXISTS == 'false'
        shell: bash
        run: |
          set -euo pipefail
          # A public bootstrap image isolates Azure Container Apps ARM provisioning from
          # ACR token, user-managed identity, internal application configuration, and ingress.
          # No public endpoint will exist at this stage.
          log="$RUNNER_TEMP/mirror-web-minimal-private.log"
          if az containerapp create --subscription "$SID" -g "$RG" -n "$WEB" \
            --environment "$CAE" \
            --image mcr.microsoft.com/azuredocs/containerapps-helloworld:latest \
            --min-replicas 0 --max-replicas 1 --cpu 0.5 --memory 1Gi \
            --only-show-errors -o none > "$log" 2>&1; then
            echo "Stage 1 PASS: target Web ARM resource created without identity, registry auth, or ingress."
          else
            python3 - "$log" <<'PY'
          import sys,re
          s=open(sys.argv[1],errors="replace").read()
          candidates=re.findall(r'"code"\s*:\s*"([A-Za-z][A-Za-z0-9_]{1,64})"',s)
          candidates+=re.findall(r'\(([A-Za-z][A-Za-z0-9_]{1,64})\)',s)
          allow={"UnexpectedException","BadRequest","Conflict","ResourceNotFound",
                 "RequestDisallowedByAzure","RequestDisallowedByPolicy","QuotaExceeded",
                 "ResourceQuotaExceeded","InvalidTemplate","OperationNotAllowed","AuthorizationFailed",
                 "InvalidParameterValue","ContainerAppOperationError","ManagedEnvironmentNotFound"}
          print("::error::Stage 1 minimal Azure Container App create failed: "+
                next((x for x in candidates if x in allow),"unclassified")+
                ". Public bootstrap payload had no ACR credentials, no identity and no ingress.")
          PY
            exit 1
          fi

      - name: Stage 2 - configure Web-specific ACR read-only credential on existing Container App
        shell: bash
        run: |
          set -euo pipefail
          # If the Web resource already exists from a partial retry, reuse it.
          # Never rotate the shared API/Grader ACR token.
          if [[ "$WEB_EXISTS" == "true" ]]; then
            echo "Reusing existing destination Web from successful stage-1/2/3 deployment."
            current="$(az containerapp show -g "$RG" -n "$WEB" --subscription "$SID" --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
            if [[ "$current" == "$ACR.azurecr.io/web-coderats-base:mirror-db35f8c2f5fb" ]]; then
              echo "Stage 2 PASS: Web already has the pinned CodeRats image from the prior successful ACR configuration."
              exit 0
            fi
            echo "::error::Existing Web image is not the expected pinned digest/tag; refusing to change unknown state."
            exit 1
          fi
          log="$RUNNER_TEMP/mirror-web-registry-private.log"
          if az containerapp registry set --subscription "$SID" -g "$RG" -n "$WEB" \
            --server "$ACR.azurecr.io" --username "$ACR_WEB_TOKEN" \
            --password "$WEB_ACR_PULL_PASSWORD" --only-show-errors -o none > "$log" 2>&1; then
            echo "Stage 2 PASS: target Web ACR registry credential set without changing API/Grader."
          else
            echo "::error::Stage 2 target Web registry configuration failed; private CLI log withheld."
            exit 1
          fi

      - name: Stage 3 - switch to pinned CodeRats Web image and configure runtime
        shell: bash
        run: |
          set -euo pipefail
          expected="$ACR.azurecr.io/web-coderats-base:mirror-db35f8c2f5fb"
          current="$(az containerapp show --subscription "$SID" -g "$RG" -n "$WEB" \
            --query 'properties.template.containers[0].image' -o tsv --only-show-errors)"
          if [[ "$current" == "$expected" ]]; then
            echo "Stage 3 PASS: exact Web image already deployed; no revision changed."
            exit 0
          fi
          if [[ "$current" != "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" ]]; then
            echo "::error::Web has unexpected image: refusing to overwrite manually changed app."
            exit 1
          fi
          log="$RUNNER_TEMP/mirror-web-update-private.log"
          if az containerapp update --subscription "$SID" -g "$RG" -n "$WEB" \
            --image "$expected" --min-replicas 1 --max-replicas 1 \
            --set-env-vars "HOSTNAME=0.0.0.0" "PORT=3000" \
              "API_PROXY_TARGET=http://$API" "NEXT_PUBLIC_API_URL=$MIRROR_WEB_ORIGIN" \
            --only-show-errors -o none > "$log" 2>&1; then
            echo "Stage 3 PASS: target Web image and exact runtime vars updated."
          else
            echo "::error::Stage 3 CodeRats image switch failed; private CLI log withheld."
            exit 1
          fi

      - name: Stage 4 - record optional Web managed identity as deferred (not needed for token-based ACR pull)
        shell: bash
        run: |
          set -euo pipefail
          # Previous ARM failures were isolated to Web user-assigned identity attachment.
          # The user-assigned identity exists, but Web uses a scoped ACR credential
          # and has no Key Vault secret references. Do not block Web availability
          # on an identity that the current runtime does not need.
          [[ "$(az account show --query id -o tsv)" == "$SID" ]]
          identity="$(az identity show -g "$RG" -n id-coderatsmig-web-c26m0911 \
            --subscription "$SID" --query id -o tsv --only-show-errors)"
          [[ -n "$identity" ]]
          echo "Stage 4: Web identity exists. Attachment deferred after isolated failure; ACR uses dedicated read-only token."
          echo "- Web managed identity: exists, attachment deferred pending separate diagnosis" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable external HTTP ingress only on the new destination Web
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show --subscription "$SID" -g "$RG" -n "$WEB" \
            --query properties.configuration.ingress.fqdn -o tsv --only-show-errors 2>/dev/null || true)"
          if [[ "$fqdn" != *.azurecontainerapps.io ]]; then
            log="$RUNNER_TEMP/mirror-web-ingress-private.log"
            if az containerapp ingress enable --subscription "$SID" -g "$RG" -n "$WEB" \
              --type external --target-port 3000 --transport auto --only-show-errors -o none > "$log" 2>&1; then
              echo "Target Web external ingress successfully enabled."
            else
              python3 - "$log" <<'PY'
          import re,sys
          s=open(sys.argv[1],errors="replace").read()
          codes=re.findall(r"\(([A-Za-z][A-Za-z0-9_]{1,64})\)",s)
          codes+=re.findall(r'"code"\s*:\s*"([A-Za-z][A-Za-z0-9_]{1,64})"',s)
          allow={"UnexpectedException","BadRequest","Conflict","ResourceNotFound","RequestDisallowedByAzure",
                 "RequestDisallowedByPolicy","ResourceQuotaExceeded","QuotaExceeded","InvalidTemplate",
                 "OperationNotAllowed","AuthorizationFailed","InvalidParameterValue",
                 "ContainerAppOperationError","ManagedEnvironmentNotFound"}
          shown=next((x for x in codes if x in allow),"unclassified")
          print("::error::Web external ingress could not be enabled (sanitized error code: "+shown+"). No private logs published.")
          PY
              exit 1
            fi
          else
            echo "Target Web already has an ingress hostname: no ingress reconfiguration attempted."
          fi

      - name: Verify Web FQDN, revision readiness and public HTTPS health
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show --subscription "$SID" -g "$RG" -n "$WEB" \
            --query properties.configuration.ingress.fqdn -o tsv --only-show-errors)"
          [[ "https://$fqdn" == "$MIRROR_WEB_ORIGIN" ]] || {
            echo "::error::Target Web hostname mismatch. No production DNS changed."
            exit 1
          }
          ready=""
          for i in $(seq 1 12); do
            ready="$(az containerapp show --subscription "$SID" -g "$RG" -n "$WEB" \
              --query properties.latestReadyRevisionName -o tsv --only-show-errors 2>/dev/null || true)"
            [[ -n "$ready" && "$ready" != "None" ]] && break
            sleep 10
          done
          [[ -n "$ready" && "$ready" != "None" ]] || {
            echo "::error::Destination Web has no ready revision; investigate app system logs privately."
            exit 1
          }
          http="000"
          for i in $(seq 1 12); do
            http="$(curl -sS -L -o /dev/null --connect-timeout 6 --max-time 15 -w '%{http_code}' "$MIRROR_WEB_ORIGIN/health" 2>/dev/null || true)"
            [[ "$http" == "200" ]] && break
            sleep 10
          done
          {
            echo "### CodeRats isolated Web recovery"
            echo "- Target: migration-target; origin DEV unchanged"
            echo "- Web endpoint: $MIRROR_WEB_ORIGIN"
            echo "- Web revision ready: yes"
            echo "- Web /health HTTP: $http"
            echo "- Grader and API unchanged"
            echo "- Real user data, OAuth, and production DNS untouched"
            echo "- Web registry token: temporary 30-day ACR read-only; replace with managed identity"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$http" == "200" ]] || {
            echo "::error::Destination Web health failed with HTTP $http; app may need routing/runtime fixes."
            exit 1
          }
          echo "Target mirror Web ready and HTTPS /health returned 200: $MIRROR_WEB_ORIGIN"

      - name: Remove temporary diagnostic logs and log out
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/mirror-web-minimal-private.log" "$RUNNER_TEMP/mirror-web-registry-private.log" "$RUNNER_TEMP/mirror-web-update-private.log" "$RUNNER_TEMP/mirror-web-identity-private.log" "$RUNNER_TEMP/mirror-web-ingress-private.log"
          az logout --output none >/dev/null 2>&1 || true
