name: Validate public check-in interaction permissions
on:
  push:
    branches: [main]
    paths: [.github/workflows/validate-public-checkin-interactions.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 50
    steps:
      - name: Issue read-only private API token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          owner: coderats-hub
          repositories: api-coderats-base
          permission-contents: read
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: coderats-hub/api-coderats-base
          ref: d226510c1c617dd62d3d4fc89d6d01b62513e38c
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
          path: source
      - name: Verify candidate SHA
        run: test "$(git -C source rev-parse HEAD)" = d226510c1c617dd62d3d4fc89d6d01b62513e38c
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Maven verification and regression tests
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x ./mvnw
          if ! ./mvnw --batch-mode verify >"$RUNNER_TEMP/verify.log" 2>&1; then
            echo "::error::Private API Maven verification failed (sanitized test diagnostics)"
            python3 - "$RUNNER_TEMP/verify.log" <<'PY'
          import pathlib,re,sys,xml.etree.ElementTree as ET
          lines=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          for line in lines:
              m=re.search(r'([A-Za-z0-9_]+\.java):\[(\d+),(\d+)\]',line)
              if '[ERROR]' in line and m:print('Compiler:',*m.groups())
              if 'Failed to execute goal' in line: print('Maven goal failure')
          for f in sorted(pathlib.Path('target/surefire-reports').glob('TEST-*.xml')):
              try:
                  root=ET.parse(f).getroot()
                  for case in root.iter('testcase'):
                      failures=[n for n in case if n.tag in ('failure','error')]
                      if failures:
                          print('Failed:',re.sub('[^a-zA-Z0-9_.-]','',case.attrib.get('classname','').split('.')[-1]),case.attrib.get('name','unknown')[:90],
                                'kind:',failures[0].attrib.get('type','unknown').split('.')[-1])
                          message=failures[0].attrib.get('message','')
                          status=re.search(r'Status expected:\s*<?(\d+)>?\s*but was:\s*<?(\d+)>?', message)
                          if status: print('HTTP status expected/actual:',*status.groups())
                          stack=failures[0].text or ''
                          origin=re.search(r'PostInteractionIntegrationTest\.java:(\d+)',stack)
                          if origin: print('Failure test line:',origin.group(1))
              except Exception: pass
          PY
            exit 1
          fi
          echo "Maven verify: PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private checkout
        if: always()
        run: rm -rf source

  frontend:
    name: Verify feed remains visible after unrelated interaction 403
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 40
    steps:
      - name: Issue read-only private frontend token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          owner: coderats-hub
          repositories: web-coderats-base
          permission-contents: read
      - name: Checkout exact frontend candidate
        uses: actions/checkout@v4
        with:
          repository: coderats-hub/web-coderats-base
          ref: 5980742daa2bc85121f9d20379b8f3aa67d70722
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
          path: source
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Tests typecheck and production build
        working-directory: source
        env:
          NEXT_PUBLIC_API_URL: https://coderats.club
          API_PROXY_TARGET: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if ! npm ci --no-audit --no-fund >"$RUNNER_TEMP/npm-install.log" 2>&1; then
            echo "::error::Frontend dependency installation failed"; exit 1
          fi
          if ! npm test -- --reporter=json --outputFile="$RUNNER_TEMP/vitest.json" >"$RUNNER_TEMP/npm-test.log" 2>&1; then
            echo "::error::Frontend Vitest suite failed"
            python3 - "$RUNNER_TEMP/vitest.json" <<'PY'
          import pathlib,json,sys
          try:
              d=json.loads(pathlib.Path(sys.argv[1]).read_text())
              print("Totals:",d.get('numTotalTests'),d.get('numFailedTests'))
              for x in d.get('testResults',[]):
                  bad=[a for a in x.get('assertionResults',[]) if a.get('status')=='failed']
                  if bad: print("Failing suite:",pathlib.Path(x.get('name','unknown')).name,"cases",len(bad))
          except Exception: print("Vitest output unavailable")
          PY
            exit 1
          fi
          if ! npx tsc --noEmit >"$RUNNER_TEMP/typecheck.log" 2>&1; then
            echo "::error::Frontend TypeScript errors"
            python3 - "$RUNNER_TEMP/typecheck.log" <<'PY'
          import pathlib,re
          for row in pathlib.Path('/tmp/not-used').glob('*'): pass
          lines=pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'typecheck.log').read_text(errors='replace').splitlines()
          for x in lines:
              m=re.search(r'([A-Za-z0-9._-]+\.tsx?)\((\d+),(\d+)\): error (TS\d+)',x)
              if m:print("Typecheck:",*m.groups())
          PY
            exit 1
          fi
          if ! npm run build -- --webpack >"$RUNNER_TEMP/build.log" 2>&1; then
            echo "::error::Frontend production build failed"; exit 1
          fi
          echo "Frontend tests, TypeScript and build: PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private checkout
        if: always()
        run: rm -rf source
