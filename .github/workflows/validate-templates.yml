name: Validate public deployment templates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public workflow metadata only
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python scripts/validate_templates.py
