name: Deploy isolated CodeRats Standard mirror applications (target only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_STANDARD_MIRROR to initialize isolated Web API Grader"
        required: true
        type: string
  push:
    branches: [main]
    paths: [".github/workflows/deploy-migration-standard-mirror-apps.yml"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: coderats-migration-standard-apps
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'coderats-hub/coderats-deploy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY_STANDARD_MIRROR') ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(migration): deploy isolated standard mirror once')))
    runs-on: ubuntu-latest
    environment: migration-target
    timeout-minutes: 90
    env:
      SID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TID: ${{ secrets.AZURE_TENANT_ID }}
      RG: rg-coderats-migration-c26m0911
      CAE: cae-coderatsmig-standard-c26m0911
      ACR: crcoderatsmigc26m0911
      DB: psql-coderatsmig-c26m0911
      STORAGE: stcoderatsmigc26m0911
      SHARE: coderats-media
      WEB: ca-cdmstd-web-c26m0911
      API: ca-cdmstd-api-c26m0911
      GRADER: ca-cdmstd-grader-c26m0911
      API_IMAGE: crcoderatsmigc26m0911.azurecr.io/api-coderats-base:mirror-899b5e0fdd5d
      GRADER_IMAGE: crcoderatsmigc26m0911.azurecr.io/api-grader-coderats:mirror-a126b16097ef
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout Web through restricted GitHub App token
        id: gh-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          owner: coderats-hub
          repositories: web-coderats-base
          permission-contents: read

      - name: Checkout pinned private Web
        uses: actions/checkout@v4
        with:
          repository: coderats-hub/web-coderats-base
          ref: db35f8c2f5fb104a47afaeaa60dad9e6e709d193
          token: ${{ steps.gh-token.outputs.token }}
          path: web-src
          persist-credentials: false

      - name: Authenticate to new Azure only
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify pinned checkout, destination Standard environment and no existing apps
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SID" == 'da3650a9-e291-43f1-ae4b-9dcc8ff84239' ]]
          [[ "$TID" == '1cf74c7e-fcd9-46f7-8a9d-e699d3529003' ]]
          [[ "$(az account show --query id -o tsv)" == "$SID" ]]
          [[ "$(az account show --query tenantId -o tsv)" == "$TID" ]]
          [[ "$(git -C web-src rev-parse HEAD)" == 'db35f8c2f5fb104a47afaeaa60dad9e6e709d193' ]]
          [[ "$(az acr show --subscription "$SID" -g "$RG" -n "$ACR" --query name -o tsv --only-show-errors)" == "$ACR" ]]
          [[ "$(az postgres flexible-server show --subscription "$SID" -g "$RG" -n "$DB" --query name -o tsv --only-show-errors)" == "$DB" ]]
          az containerapp env show --subscription "$SID" -g "$RG" -n "$CAE" \
            --only-show-errors -o json > "$RUNNER_TEMP/standard-env-private.json"
          python3 - <<'PY'
          import json,os,sys
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'standard-env-private.json')))
          p=d.get('properties') or {}
          profiles=p.get('workloadProfiles') or []
          ok=(d.get('name')==os.environ['CAE'] and p.get('provisioningState')=='Succeeded' and
              str(p.get('environmentMode') or '').lower() in ('','workloadprofiles') and
              any(isinstance(v,dict) and v.get('name')=='Consumption' for v in profiles))
          if not ok:sys.exit('::error::Destination is not the verified Standard Consumption CAE.')
          domain=str(p.get('defaultDomain') or '')
          if not domain.endswith('.brazilsouth.azurecontainerapps.io'):
              sys.exit('::error::Unexpected destination region/domain.')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('STANDARD_DOMAIN='+domain+'\n')
              f.write('WEB_ORIGIN=https://'+os.environ['WEB']+'.'+domain+'\n')
              f.write('API_ORIGIN=https://'+os.environ['API']+'.'+domain+'\n')
          print('Standard destination verified with no access to source DEV.')
          PY
          for app in "$WEB" "$API" "$GRADER"; do
            if az containerapp show --subscription "$SID" -g "$RG" -n "$app" \
              --query name -o tsv --only-show-errors >/dev/null 2>&1; then
              echo '::error::Destination Standard mirror app already exists; refusing overwrite.'
              exit 1
            fi
          done
          echo 'No Standard destination mirror apps exist; safe to initialize.'

      - name: Read isolated database credential from destination Terraform state only
        shell: bash
        run: |
          set -euo pipefail
          key="$(az storage account keys list --subscription "$SID" -g rg-coderats-migration-state \
            -n stcrtf8ff84239 --query '[0].value' -o tsv --only-show-errors)"
          [[ -n "$key" ]] || { echo '::error::Destination state access unavailable.'; exit 1; }
          echo "::add-mask::$key"
          if ! az storage blob download --account-name stcrtf8ff84239 --account-key "$key" \
            --container-name tfstate --name coderats/migration-target.tfstate \
            --file "$RUNNER_TEMP/standard-db-target-state.json" \
            --only-show-errors -o none > "$RUNNER_TEMP/state-private.log" 2>&1; then
            echo '::error::Destination-only Terraform secret state could not be read.'
            exit 1
          fi
          unset key
          pass="$(python3 - <<'PY'
          import json,os,sys
          x=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'standard-db-target-state.json')))
          p=(x.get('outputs') or {}).get('postgres_admin_password') or {}
          v=p.get('value') or ''
          if not isinstance(v,str) or len(v)<32:sys.exit(1)
          print(v,end='')
          PY
          )" || { echo '::error::Destination database secret unavailable in isolated state.'; exit 1; }
          echo "::add-mask::$pass"
          echo "MIRROR_DB_PASSWORD=$pass" >> "$GITHUB_ENV"
          unset pass
          echo 'Isolated target DB secret retrieved; no source state accessed.'

      - name: Prepare isolated app-to-app credentials
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          oauth="$(openssl rand -hex 20)"
          echo "::add-mask::$token"
          echo "::add-mask::$oauth"
          echo "MIRROR_GRADER_SERVICE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "MIRROR_OAUTH_PLACEHOLDER=$oauth" >> "$GITHUB_ENV"
          unset token oauth

      - name: Create separate scoped ACR read token and short-lived push credential
        shell: bash
        run: |
          set -euo pipefail
          for token in coderats-standard-pull coderats-standard-build; do
            if ! az acr token show --registry "$ACR" --name "$token" --subscription "$SID" \
              --query name -o tsv --only-show-errors >/dev/null 2>&1; then
              scope=_repositories_pull
              [[ "$token" == coderats-standard-build ]] && scope=_repositories_push
              az acr token create --registry "$ACR" --name "$token" --scope-map "$scope" \
                --subscription "$SID" --only-show-errors -o none > "$RUNNER_TEMP/acr-token-private.log" 2>&1 || {
                echo '::error::Destination ACR scoped token could not be created.'; exit 1; }
            fi
            az acr token update --registry "$ACR" --name "$token" --status enabled \
              --subscription "$SID" --only-show-errors -o none > "$RUNNER_TEMP/acr-token-private.log" 2>&1 || {
              echo '::error::Destination ACR scoped token unavailable.'; exit 1; }
          done
          pullpass="$(az acr token credential generate --registry "$ACR" --name coderats-standard-pull \
            --password1 --expiration-in-days 30 --subscription "$SID" \
            --query 'passwords[0].value' -o tsv --only-show-errors)"
          pushpass="$(az acr token credential generate --registry "$ACR" --name coderats-standard-build \
            --password1 --expiration-in-days 1 --subscription "$SID" \
            --query 'passwords[0].value' -o tsv --only-show-errors)"
          [[ -n "$pullpass" && -n "$pushpass" ]] || { echo '::error::Destination ACR scoped credential generation failed.'; exit 1; }
          echo "::add-mask::$pullpass"
          echo "::add-mask::$pushpass"
          echo "ACR_STD_PULL_PASSWORD=$pullpass" >> "$GITHUB_ENV"
          if ! printf '%s' "$pushpass" | docker login "$ACR.azurecr.io" \
            --username coderats-standard-build --password-stdin \
            > "$RUNNER_TEMP/docker-login-private.log" 2>&1; then
            echo '::error::Destination ACR scoped push authentication failed.'
            exit 1
          fi
          unset pullpass pushpass
          echo 'Separate Standard ACR pull token and one-day build token created.'

      - name: Register existing empty media share in Standard environment only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(az storage share-rm show --subscription "$SID" -g "$RG" \
             --storage-account "$STORAGE" --name "$SHARE" --query name -o tsv --only-show-errors)" == "$SHARE" ]]
          az containerapp env storage list --subscription "$SID" -g "$RG" -n "$CAE" \
            --only-show-errors -o json > "$RUNNER_TEMP/std-storages-private.json"
          python3 - <<'PY'
          import json,os,sys
          a=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'std-storages-private.json')))
          if any(isinstance(v,dict) and v.get('name')==os.environ['SHARE'] for v in (a if isinstance(a,list) else [])):
              sys.exit('::error::Unexpected Standard CAE storage binding; refusing overwrite.')
          PY
          key="$(az storage account keys list --subscription "$SID" -g "$RG" \
            -n "$STORAGE" --query '[0].value' -o tsv --only-show-errors)"
          [[ -n "$key" ]] || { echo '::error::Destination media storage key unavailable.'; exit 1; }
          echo "::add-mask::$key"
          if ! az containerapp env storage set --subscription "$SID" -g "$RG" -n "$CAE" \
            --storage-name "$SHARE" --access-mode ReadWrite \
            --azure-file-account-name "$STORAGE" --azure-file-account-key "$key" \
            --azure-file-share-name "$SHARE" --only-show-errors -o none \
            > "$RUNNER_TEMP/std-media-private.log" 2>&1; then
            echo '::error::Standard destination Azure Files link failed. Private CLI error suppressed.'
            exit 1
          fi
          unset key
          echo 'Azure Files bound to Standard CAE. No media content accessed.'

      - name: Create Standard private Grader (isolated empty DB)
        shell: bash
        run: |
          set -euo pipefail
          ident="$(az identity show --subscription "$SID" -g "$RG" -n id-coderatsmig-grader-c26m0911 \
            --query id -o tsv --only-show-errors)"
          url="postgresql+asyncpg://coderats_admin:$MIRROR_DB_PASSWORD@$DB.postgres.database.azure.com:5432/coderats_grader?ssl=require"
          if ! az containerapp create --subscription "$SID" -g "$RG" -n "$GRADER" \
            --environment "$CAE" --image "$GRADER_IMAGE" --user-assigned "$ident" \
            --registry-server "$ACR.azurecr.io" --registry-username coderats-standard-pull \
            --registry-password "$ACR_STD_PULL_PASSWORD" --workload-profile-name Consumption \
            --ingress internal --target-port 8000 --min-replicas 1 --max-replicas 1 \
            --cpu 0.5 --memory 1Gi --secrets "grader-db-url=$url" "grader-service-token=$MIRROR_GRADER_SERVICE_TOKEN" \
            --env-vars "DATABASE_URL=secretref:grader-db-url" \
              "AUTOGRADER_INTEGRATION_TOKEN=secretref:grader-service-token" \
              "SANDBOX_MODE=remote" "APP_ENV=migration" "OPENAI_MODEL=gpt-6" \
            --only-show-errors -o none > "$RUNNER_TEMP/std-grader-private.log" 2>&1; then
            echo '::error::New Standard Grader creation failed; private logs suppressed.'
            exit 1
          fi
          echo 'Isolated Standard Grader created without real data or AI key.'

      - name: Create Standard private API (GitHub OAuth and GET disabled)
        shell: bash
        run: |
          set -euo pipefail
          ident="$(az identity show --subscription "$SID" -g "$RG" -n id-coderatsmig-api-c26m0911 \
            --query id -o tsv --only-show-errors)"
          jdbc="jdbc:postgresql://$DB.postgres.database.azure.com:5432/coderats_base?sslmode=require"
          if ! az containerapp create --subscription "$SID" -g "$RG" -n "$API" \
            --environment "$CAE" --image "$API_IMAGE" --user-assigned "$ident" \
            --registry-server "$ACR.azurecr.io" --registry-username coderats-standard-pull \
            --registry-password "$ACR_STD_PULL_PASSWORD" --workload-profile-name Consumption \
            --ingress internal --target-port 8080 --min-replicas 1 --max-replicas 1 \
            --cpu 0.5 --memory 1Gi \
            --secrets "database-password=$MIRROR_DB_PASSWORD" \
              "grader-service-token=$MIRROR_GRADER_SERVICE_TOKEN" \
              "github-oauth-placeholder=$MIRROR_OAUTH_PLACEHOLDER" \
            --env-vars "DATABASE_URL=$jdbc" "DATABASE_USERNAME=coderats_admin" \
              "DATABASE_PASSWORD=secretref:database-password" \
              "APP_RUNTIME_MODE=http" "SPRING_PROFILES_ACTIVE=prod" \
              "SERVER_SERVLET_SESSION_COOKIE_SECURE=true" \
              "FRONTEND_URL=$WEB_ORIGIN" "GITHUB_OAUTH_REDIRECT_URI=$WEB_ORIGIN/login/oauth2/code/github" \
              "CORS_ALLOWED_ORIGINS=$WEB_ORIGIN" \
              "GITHUB_APP_CLIENT_ID=migration-oauth-disabled" \
              "GITHUB_APP_CLIENT_SECRET=secretref:github-oauth-placeholder" \
              "GRADER_API_URL=https://$GRADER.$STANDARD_DOMAIN" \
              "GRADER_SERVICE_TOKEN=secretref:grader-service-token" \
              "GRADER_POLLING_ENABLED=false" \
              "MEDIA_STORAGE_DIRECTORY=/tmp/coderats-media" \
              "MEDIA_PUBLIC_BASE_URL=$WEB_ORIGIN/api/v1/media" \
              "GET_WORKER_ENABLED=false" "GET_BACKFILL_ENABLED=false" \
            --only-show-errors -o none > "$RUNNER_TEMP/std-api-private.log" 2>&1; then
            echo '::error::New Standard API creation failed; private logs suppressed.'
            exit 1
          fi
          echo 'Isolated Standard API created with GET and OAuth disabled.'

      - name: Mount persistent Azure Files on Standard API revision
        shell: bash
        run: |
          set -euo pipefail
          az containerapp show --subscription "$SID" -g "$RG" -n "$API" \
            --only-show-errors -o json > "$RUNNER_TEMP/std-api-before-private.json"
          python3 - <<'PY'
          import json,os,sys
          p=os.path.join(os.environ['RUNNER_TEMP'],'std-api-before-private.json')
          d=json.load(open(p))
          props=d.get('properties') or {}
          tmpl=props.get('template') or {}
          c=tmpl.get('containers') or []
          if d.get('name')!=os.environ['API'] or len(c)!=1 or (tmpl.get('volumes') or []):
              sys.exit('::error::Unexpected Standard API storage template; refusing overwrite.')
          tmpl['volumes']=[{'name':'coderats-media-volume','storageType':'AzureFile','storageName':os.environ['SHARE']}]
          c[0]['volumeMounts']=[{'volumeName':'coderats-media-volume','mountPath':'/tmp/coderats-media'}]
          (props.get('configuration') or {}).pop('secrets',None)
          with open(os.path.join(os.environ['RUNNER_TEMP'],'std-api-media.yaml'),'w') as f:json.dump(d,f)
          PY
          if ! az containerapp update --subscription "$SID" -g "$RG" -n "$API" \
            --yaml "$RUNNER_TEMP/std-api-media.yaml" --only-show-errors -o none \
            > "$RUNNER_TEMP/std-api-mount-private.log" 2>&1; then
            echo '::error::Standard API volume mount failed; private details suppressed.'
            exit 1
          fi
          echo 'Standard API media mount revision submitted.'

      - name: Build and push pinned Web with new verified HTTPS API origin
        shell: bash
        run: |
          set -euo pipefail
          image="$ACR.azurecr.io/web-coderats-base:mirror-standard-db35f8c2f5fb-$GITHUB_RUN_ID"
          if ! docker build -f web-src/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_URL=$WEB_ORIGIN" \
            --build-arg "API_PROXY_TARGET=$API_ORIGIN" \
            -t "$image" web-src > "$RUNNER_TEMP/std-web-build-private.log" 2>&1; then
            echo '::error::Pinned Standard Web build failed; private logs suppressed.'
            exit 1
          fi
          if ! docker push "$image" >> "$RUNNER_TEMP/std-web-build-private.log" 2>&1; then
            echo '::error::Standard Web ACR push failed; private logs suppressed.'
            exit 1
          fi
          echo "MIRROR_WEB_IMAGE=$image" >> "$GITHUB_ENV"
          echo 'Standard Web image built and pushed using new certificate-valid API origin.'

      - name: Create Standard public Web app
        shell: bash
        run: |
          set -euo pipefail
          if ! az containerapp create --subscription "$SID" -g "$RG" -n "$WEB" \
            --environment "$CAE" --image "$MIRROR_WEB_IMAGE" \
            --registry-server "$ACR.azurecr.io" --registry-username coderats-standard-pull \
            --registry-password "$ACR_STD_PULL_PASSWORD" --workload-profile-name Consumption \
            --ingress external --target-port 3000 --min-replicas 1 --max-replicas 1 \
            --cpu 0.5 --memory 1Gi \
            --env-vars "HOSTNAME=0.0.0.0" "PORT=3000" \
              "API_PROXY_TARGET=$API_ORIGIN" "NEXT_PUBLIC_API_URL=$WEB_ORIGIN" \
            --only-show-errors -o none > "$RUNNER_TEMP/std-web-create-private.log" 2>&1; then
            echo '::error::New Standard Web app creation failed; private details suppressed.'
            exit 1
          fi
          echo 'Standard Web created with separate temporary Azure HTTPS origin.'

      - name: Verify three Standard revisions and anonymous Web API proxy
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 24); do
            if [[ "$(curl -fsS -o /dev/null --max-time 20 -w '%{http_code}' "$WEB_ORIGIN/health" 2>/dev/null || true)" == 200 &&
                  "$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "$WEB_ORIGIN/api/v1/auth/me" 2>/dev/null || true)" == 401 ]]; then
              ok=true;break
            fi
            sleep 10
          done
          [[ "$ok" == true ]] || { echo '::error::New Standard Web to API HTTPS proxy smoke failed.'; exit 1; }
          for app in "$GRADER" "$API" "$WEB"; do
            az containerapp show --subscription "$SID" -g "$RG" -n "$app" --only-show-errors \
              --query '{name:name,status:properties.runningStatus,ready:properties.latestReadyRevisionName,latest:properties.latestRevisionName}' \
              -o json > "$RUNNER_TEMP/check-$(basename "$app").json"
          done
          python3 - <<'PY'
          import json,os,glob,sys
          paths=glob.glob(os.path.join(os.environ['RUNNER_TEMP'],'check-ca-cdmstd-*.json'))
          if len(paths)!=3:sys.exit('::error::Expected three Standard app revision checks.')
          for p in paths:
              a=json.load(open(p))
              if a.get('status')!='Running' or not a.get('ready') or a.get('ready')!=a.get('latest'):
                  sys.exit('::error::Standard app latest/ready revision mismatch.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Isolated CodeRats Standard mirror application delivery\n')
              f.write('- Three Standard apps in Brazil South: revision state Running and Ready\n')
              f.write('- Web /health 200; anonymous Web API /auth/me 401\n')
              f.write('- API AzureFiles media mount applied; files not read or copied\n')
              f.write('- OAuth intentionally disabled; Grader AI not configured; GET worker not started\n')
              f.write('- Source DEV, DNS, production data, original Express mirror: unchanged\n')
          PY
          echo 'Target Standard Web/API/Grader initial smoke passed (no private payloads).'

      - name: Delete temporary credentials and private files from ephemeral runner
        if: always()
        shell: bash
        run: |
          docker logout crcoderatsmigc26m0911.azurecr.io >/dev/null 2>&1 || true
          az acr token credential delete -r crcoderatsmigc26m0911 -n coderats-standard-build \
            --password1 --subscription "$SID" --only-show-errors -o none >/dev/null 2>&1 || true
          rm -rf web-src
          rm -f "$RUNNER_TEMP"/standard-env-private.json "$RUNNER_TEMP"/standard-db-target-state.json \
            "$RUNNER_TEMP"/state-private.log "$RUNNER_TEMP"/acr-token-private.log \
            "$RUNNER_TEMP"/docker-login-private.log "$RUNNER_TEMP"/std-*-private.log \
            "$RUNNER_TEMP"/std-*-private.json "$RUNNER_TEMP"/std-api-media.yaml \
            "$RUNNER_TEMP"/check-ca-cdmstd-*.json
          az logout -o none >/dev/null 2>&1 || true
