name: Verify CodeRats migration-target apps and readiness (read-only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type VERIFY_MIGRATION_TARGET for read-only inspection"
        required: true
        type: string
  push:
    branches: [main]
    paths: [".github/workflows/verify-migration-target-isolated-apps.yml"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: coderats-migration-target-smoke-audit
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'coderats-hub/coderats-deploy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'VERIFY_MIGRATION_TARGET') ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(migration): audit isolated target readiness')))
    runs-on: ubuntu-latest
    environment: migration-target
    timeout-minutes: 15
    env:
      SID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TID: ${{ secrets.AZURE_TENANT_ID }}
      RG: rg-coderats-migration-c26m0911
      CAE: cae-coderatsmig-c26m0911
      DB: psql-coderatsmig-c26m0911
      WEB: ca-coderatsmig-web-c26m0911
      API: ca-coderatsmig-api-c26m0911
      GRADER: ca-coderatsmig-grader-c26m0911

    steps:
      - name: Authenticate to target OIDC only
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target identity and three live revision states without reading secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SID" == "da3650a9-e291-43f1-ae4b-9dcc8ff84239" ]]
          [[ "$TID" == "1cf74c7e-fcd9-46f7-8a9d-e699d3529003" ]]
          [[ "$(az account show --query id -o tsv)" == "$SID" ]]
          [[ "$(az account show --query tenantId -o tsv)" == "$TID" ]]
          domain="$(az containerapp env show --subscription "$SID" -g "$RG" -n "$CAE" \
            --query properties.defaultDomain -o tsv --only-show-errors)"
          [[ "$domain" == *.brazilsouth.azurecontainerapps.io ]]
          echo "TARGET_DOMAIN=$domain" >> "$GITHUB_ENV"
          echo "### New Azure target — application readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Destination subscription, tenant, resource group and CAE: verified" >> "$GITHUB_STEP_SUMMARY"
          for kind in web api grader; do
            case "$kind" in
              web) app="$WEB"; expected_ingress="true"; port=3000 ;;
              api) app="$API"; expected_ingress="false"; port=8080 ;;
              grader) app="$GRADER"; expected_ingress="false"; port=8000 ;;
            esac
            az containerapp show --subscription "$SID" -g "$RG" -n "$app" \
              --query '{name:name,running:properties.runningStatus,provisioning:properties.provisioningState,identity:identity.type,ingress:properties.configuration.ingress,containers:properties.template.containers}' \
              -o json --only-show-errors > "$RUNNER_TEMP/app-$kind-private.json"
            az containerapp revision list --subscription "$SID" -g "$RG" -n "$app" \
              --only-show-errors -o json > "$RUNNER_TEMP/revisions-$kind-private.json"
            KIND="$kind" EXPECTED_APP="$app" EXPECTED_INGRESS="$expected_ingress" EXPECTED_PORT="$port" python3 - <<'PY'
          import json,os
          root=os.environ["RUNNER_TEMP"]
          kind=os.environ["KIND"]
          d=json.load(open(os.path.join(root,"app-"+kind+"-private.json")))
          rev=json.load(open(os.path.join(root,"revisions-"+kind+"-private.json")))
          ingress=d.get("ingress") or {}
          expected_external=os.environ["EXPECTED_INGRESS"]=="true"
          ok_running=d.get("running")=="Running"
          ok_name=d.get("name")==os.environ["EXPECTED_APP"]
          ok_ingress=ingress.get("external") is expected_external and ingress.get("targetPort")==int(os.environ["EXPECTED_PORT"])
          healthy=[r for r in rev if isinstance(r,dict) and (r.get("properties") or {}).get("active") is True and
                   (r.get("properties") or {}).get("healthState")=="Healthy" and
                   (r.get("properties") or {}).get("runningState")=="Running"] if isinstance(rev,list) else []
          state=d.get("provisioning")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("- "+kind+": running="+str(ok_running)+", app name verified="+str(ok_name)+
                      ", expected ingress/port="+str(ok_ingress)+
                      ", active Healthy revision="+str(bool(healthy))+
                      ", ARM provisioning="+str(state if state in ("Succeeded","Failed","InProgress") else "other")+
                      ", managed identity attached="+str(d.get("identity") not in ("None",None,""))+"\n")
          if not(ok_name and ok_running and ok_ingress and healthy):
              print("::error::"+kind+" target app failed isolated runtime/ingress checks.")
              raise SystemExit(1)
          PY
          done
          cat "$GITHUB_STEP_SUMMARY"

      - name: Verify isolated Web HTTPS and anonymous API proxy without exposing user content
        shell: bash
        run: |
          set -euo pipefail
          url="https://$WEB.$TARGET_DOMAIN"
          health="$(curl -fsS -L -o /dev/null --connect-timeout 6 --max-time 18 -w '%{http_code}' "$url/health" 2>/dev/null || true)"
          auth="$(curl -sS -L -o /dev/null --connect-timeout 6 --max-time 18 -w '%{http_code}' "$url/api/v1/auth/me" 2>/dev/null || true)"
          [[ "$health" =~ ^[0-9]{3}$ ]] || health="unavailable"
          [[ "$auth" =~ ^[0-9]{3}$ ]] || auth="unavailable"
          {
            echo "### HTTPS browser entrypoint / API connectivity"
            echo "- Web /health: HTTP $health (expected 200)"
            echo "- Web /api/v1/auth/me without login: HTTP $auth (expected 401)"
            echo "- No cookies, request headers, redirect targets, tokens or response bodies captured"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$health" == "200" && "$auth" == "401" ]] || {
            echo "::error::Frontend/HTTP API proxy integration check failed."
            exit 1
          }
          echo "All anonymous Web-to-API smoke gates passed."

      - name: Inspect database firewall and pending GET job presence (read-only)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SID" == "da3650a9-e291-43f1-ae4b-9dcc8ff84239" ]]
          az postgres flexible-server show --subscription "$SID" -g "$RG" -n "$DB" \
            --query '{name:name,state:state,version:version,publicAccess:network.publicNetworkAccess,delegatedSubnet:network.delegatedSubnetResourceId,privateDns:network.privateDnsZoneArmResourceId}' \
            -o json --only-show-errors > "$RUNNER_TEMP/database-private.json"
          if az postgres flexible-server firewall-rule list --subscription "$SID" -g "$RG" --server-name "$DB" \
              --only-show-errors -o json > "$RUNNER_TEMP/firewall-private.json" 2>/dev/null; then
            # Same-step Python reads the process environment, not GITHUB_ENV
            # (which GitHub Actions applies only to later steps).
            export FIREWALL_QUERY_OK=true
          else
            export FIREWALL_QUERY_OK=false
            echo '[]' > "$RUNNER_TEMP/firewall-private.json"
          fi
          az containerapp job list --subscription "$SID" -g "$RG" \
            --only-show-errors -o json > "$RUNNER_TEMP/target-jobs-private.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/target-jobs-private.json"
          python3 - <<'PY'
          import json,os
          root=os.environ["RUNNER_TEMP"]
          db=json.load(open(os.path.join(root,"database-private.json")))
          fw=json.load(open(os.path.join(root,"firewall-private.json")))
          jobs=json.load(open(os.path.join(root,"target-jobs-private.json")))
          fw=fw if isinstance(fw,list) else []
          jobs=jobs if isinstance(jobs,list) else []
          queried=os.environ.get("FIREWALL_QUERY_OK")=="true"
          wide=any(f.get("startIpAddress")=="0.0.0.0" and f.get("endIpAddress")=="0.0.0.0" for f in fw if isinstance(f,dict)) if queried else None
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Database and worker migration readiness (no writes)\n")
              f.write("- Target PostgreSQL provisioned: "+str(db.get("name")=="psql-coderatsmig-c26m0911")+"\n")
              f.write("- PostgreSQL state: "+str(db.get("state") if db.get("state") in ("Ready","Starting","Stopped","Updating") else "other")+"\n")
              f.write("- PostgreSQL major version 16: "+str(str(db.get("version","")).startswith("16"))+"\n")
              f.write("- Public network access: "+str(db.get("publicAccess") if db.get("publicAccess") in ("Enabled","Disabled") else "other")+"\n")
              f.write("- Private delegated subnet configured: "+str(bool(db.get("delegatedSubnet")))+"\n")
              f.write("- Private DNS zone configured: "+str(bool(db.get("privateDns")))+"\n")
              f.write("- Firewall query succeeded: "+str(queried)+"\n")
              f.write("- Firewall rule count: "+(str(len(fw)) if queried else "unavailable")+"\n")
              f.write("- Broad Azure-services firewall rule 0.0.0.0 present: "+(str(wide) if queried else "unverified")+" (security review before data migration)\n")
              f.write("- Container Apps Jobs currently registered in target RG: "+str(len(jobs))+"\n")
              f.write("- Real database tables, rows, credentials and user data were NOT read\n")
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - name: Verify target media share and API mounts without listing private files
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SID" == "da3650a9-e291-43f1-ae4b-9dcc8ff84239" ]]
          media="stcoderatsmigc26m0911"
          if az storage account show --subscription "$SID" -g "$RG" -n "$media" \
            --query name --only-show-errors -o tsv > "$RUNNER_TEMP/media-account-name.txt" 2>/dev/null; then
            media_exists="$(cat "$RUNNER_TEMP/media-account-name.txt")"
            [[ "$media_exists" == "$media" ]] || {
              echo "::error::Unexpected target media storage identity."; exit 1;
            }
            echo "- Target media Storage Account: exists" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Target media Storage Account: query unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi
          if az storage share-rm show --subscription "$SID" -g "$RG" \
              --storage-account "$media" --name coderats-media \
              --query name --only-show-errors -o tsv > "$RUNNER_TEMP/media-share-name.txt" 2>/dev/null; then
            share="$(cat "$RUNNER_TEMP/media-share-name.txt")"
            [[ "$share" == "coderats-media" ]] || {
              echo "::error::Unexpected target media share identity."; exit 1;
            }
            echo "- Target Azure Files share coderats-media: exists" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Target Azure Files share coderats-media: not verified" >> "$GITHUB_STEP_SUMMARY"
          fi
          az containerapp show --subscription "$SID" -g "$RG" -n "$API" \
            --query '{volumes:properties.template.volumes,mounts:properties.template.containers[0].volumeMounts}' \
            --only-show-errors -o json > "$RUNNER_TEMP/api-media-private.json"
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"api-media-private.json")))
          volumes=x.get("volumes") or []
          mounts=x.get("mounts") or []
          # Do not reveal any storage mount paths or storage identifiers, only
          # whether an Azure Files volume and corresponding API mount exist.
          azure=[v for v in volumes if isinstance(v,dict) and str(v.get("storageType","")).lower()=="azurefile"]
          mounted=any(isinstance(m,dict) and any(m.get("volumeName")==v.get("name") for v in azure) for m in mounts)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Target API media mount readiness (no share content accessed)\n")
              f.write("- API declares AzureFile volume: "+str(bool(azure))+"\n")
              f.write("- API mounts that AzureFile volume: "+str(mounted)+"\n")
              f.write("- Media file names, contents, credentials and paths not read or printed\n")
          PY
          cat "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/media-account-name.txt" "$RUNNER_TEMP/media-share-name.txt" \
            "$RUNNER_TEMP/api-media-private.json"

      - name: Read-only target media binding and ARM activity classification
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SID" == 'da3650a9-e291-43f1-ae4b-9dcc8ff84239' ]]
          [[ "$TID" == '1cf74c7e-fcd9-46f7-8a9d-e699d3529003' ]]
          echo '### Azure Files mount registration diagnostics (read-only)' >> "$GITHUB_STEP_SUMMARY"
          if az containerapp env storage list --subscription "$SID" -g "$RG" -n "$CAE" \
            --only-show-errors -o json > "$RUNNER_TEMP/env-storages-private.json" 2>/dev/null; then
            python3 - <<'PY'
          import json,os
          x=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'env-storages-private.json')))
          a=x if isinstance(x,list) else []
          match=[v for v in a if isinstance(v,dict) and v.get('name')=='coderats-media']
          exact=bool(match) and all(((v.get('properties') or {}).get('azureFile') or {}).get('accountName')=='stcoderatsmigc26m0911' and ((v.get('properties') or {}).get('azureFile') or {}).get('shareName')=='coderats-media' for v in match)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('- Target-only Container Apps Environment storage binding present: '+str(bool(match))+'\n')
              f.write('- Storage account/share link matches expected target: '+str(exact)+'\n')
          PY
          else
            echo '- Container Apps Environment storage listing: unavailable' >> "$GITHUB_STEP_SUMMARY"
          fi
          if az monitor activity-log list --subscription "$SID" --resource-group "$RG" --offset 3h --max-events 150 \
            --only-show-errors -o json > "$RUNNER_TEMP/activity-private.json" 2>/dev/null; then
            python3 - <<'PY'
          import json,os,re
          x=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'activity-private.json')))
          x=x if isinstance(x,list) else []
          matched=[]
          for a in x:
              if not isinstance(a,dict): continue
              op=a.get('operationName') or {}
              name=op.get('value','') if isinstance(op,dict) else str(op)
              if 'microsoft.app/managedenvironments/storages/write' in name.lower():
                  matched.append(a)
          env_events=[]
          for a in x:
              if not isinstance(a,dict): continue
              op=a.get('operationName') or {}
              name=op.get('value','') if isinstance(op,dict) else str(op)
              resource=str(a.get('resourceId','')).lower().rstrip('/')
              if name.lower()=='microsoft.app/managedenvironments/write' and resource.endswith('/cae-coderatsmig-standard-c26m0911'):
                  env_events.append(a)
          failed=[]
          codes=['AuthorizationFailed','LinkedAuthorizationFailed','RequestDisallowedByPolicy',
                 'Forbidden','BadRequest','Conflict','InvalidRequestContent',
                 'MissingSubscriptionRegistration','NoRegisteredProviderFound','ResourceNotFound',
                 'OperationNotAllowed','InternalServerError','ServiceUnavailable','TooManyRequests']
          groups={}
          std_groups={}
          std_failed=[]
          for a in matched:
              resource=str(a.get('resourceId','')).lower()
              is_standard='/managedenvironments/cae-coderatsmig-standard-c26m0911/' in resource
              status=a.get('status') or {}
              val=status.get('value','other') if isinstance(status,dict) else str(status)
              status=val if val in ('Succeeded','Failed','Started','Accepted') else 'Other'
              groups[status]=groups.get(status,0)+1
              if is_standard: std_groups[status]=std_groups.get(status,0)+1
              if status=='Failed':
                  p=a.get('properties') or {}
                  msg=str(p.get('statusMessage',''))[:8000] if isinstance(p,dict) else ''
                  code=next((c for c in codes if re.search(r'(?<![A-Za-z])'+c+r'(?![A-Za-z])',msg,re.I)), 'Unclassified')
                  try:
                      detail=json.loads(msg)
                  except (ValueError,TypeError,RecursionError):
                      detail={}
                  if isinstance(detail,dict):
                      for item in (detail.get('error'),detail.get('properties'),detail):
                          if isinstance(item,dict):
                              candidate=item.get('code')
                              if isinstance(candidate,str) and re.fullmatch(r'[A-Za-z][A-Za-z0-9_]{1,48}',candidate):
                                  code=candidate
                                  break
                  if code=='Unclassified':
                      result=re.search(r'"code"\s*:\s*"([A-Za-z][A-Za-z0-9_]{1,48})"',msg)
                      if result:code=result.group(1)
                  failed.append(code)
                  if is_standard: std_failed.append(code)
          env_states={}
          env_codes=[]
          for a in env_events:
              st=a.get('status') or {}
              sv=st.get('value','Other') if isinstance(st,dict) else str(st)
              sv=sv if sv in ('Started','Failed','Succeeded','Accepted') else 'Other'
              env_states[sv]=env_states.get(sv,0)+1
              if sv=='Failed':
                  p=a.get('properties') or {}
                  msg=p.get('statusMessage','') if isinstance(p,dict) else ''
                  try:
                      detail=json.loads(msg) if isinstance(msg,str) else msg
                  except (ValueError,TypeError):
                      detail={}
                  code='Unclassified'
                  if isinstance(detail,dict):
                      for node in (detail.get('error'), detail):
                          if isinstance(node,dict):
                              c=node.get('code')
                              if isinstance(c,str) and re.fullmatch(r'[A-Za-z][A-Za-z0-9_]{1,48}',c):
                                  code=c;break
                  env_codes.append(code)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('- Target Standard CAE ARM create/write events (last 3h): '+str(len(env_events))+'\n')
              f.write('- Target Standard CAE ARM statuses: '+(', '.join(k+':'+str(v) for k,v in sorted(env_states.items())) if env_states else 'none')+'\n')
              f.write('- Target Standard CAE ARM failure classes: '+(', '.join(sorted(set(env_codes))) if env_codes else 'none observed')+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('- Azure ARM storage write events observed (last 3h): '+str(len(matched))+'\n')
              f.write('- ARM statuses: '+(', '.join(k+':'+str(v) for k,v in sorted(groups.items())) if groups else 'none')+'\n')
              f.write('- ARM failure classes: '+(', '.join(sorted(set(failed))) if failed else 'none observed')+'\n')
              f.write('- ARM failed event count: '+str(len(failed))+'\n')
              f.write('- Standard CAE media ARM event statuses: '+(', '.join(k+':'+str(v) for k,v in sorted(std_groups.items())) if std_groups else 'none')+'\n')
              f.write('- Standard CAE media ARM failure classes: '+(', '.join(sorted(set(std_failed))) if std_failed else 'none observed')+'\n')
              f.write('- No raw activity-log messages, credentials or storage paths published\n')
          PY
          else
            echo '- Azure ARM activity-log query: unavailable (does not mean zero failures)' >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$RUNNER_TEMP/env-storages-private.json" "$RUNNER_TEMP/activity-private.json"
          echo 'Target-only read-only registration diagnostic completed.'
          # This summary contains only booleans, status counts and allowlisted
          # error classes; no credentials or Azure raw messages.
          cat "$GITHUB_STEP_SUMMARY"

      - name: Cleanup private transient files and Azure session
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/app-*-private.json "$RUNNER_TEMP"/revisions-*-private.json \
            "$RUNNER_TEMP"/database-private.json "$RUNNER_TEMP"/firewall-private.json \
            "$RUNNER_TEMP"/target-jobs-private.json
          az logout -o none >/dev/null 2>&1 || true
