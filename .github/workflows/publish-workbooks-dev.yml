name: Provision CodeRats DEV Azure Workbooks
on:
  push:
    branches: [main]
    paths:
      - 'observability/workbooks/**'
      - '.github/workflows/publish-workbooks-dev.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_WORKBOOKS_DEV
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: >-
      github.repository == 'coderats-hub/coderats-deploy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PUBLISH_WORKBOOKS_DEV') ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(dev): provision observability and benchmark')))
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Azure login using existing DEV federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish idempotent Workbook resources (no Terraform state mutation)
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CODERATS_AZURE_RESOURCE_GROUP: rg-coderats-base-dev
        run: python3 scripts/publish_workbooks.py
      - name: Diagnose DEV Log Analytics ingestion (aggregates only)
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: python3 scripts/diagnose_telemetry_dev.py
