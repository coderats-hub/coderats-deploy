# Copy to .github/workflows/dev-self-hosted.yml in PRIVATE web-coderats-base.
name: CodeRats web DEV (self-hosted)
on:
  workflow_dispatch:
  # Enable automatic releases only after testing the self-hosted runner.
  # push:
  #   branches: [develop]
permissions:
  contents: read
  id-token: write
jobs:
  dev:
    if: github.ref == 'refs/heads/develop'
    uses: coderats-hub/coderats-deploy/.github/workflows/dev-container.yml@REPLACE_WITH_FULL_40_CHARACTER_PUBLIC_REPO_SHA
    with:
      service: web
      resource_group: rg-coderats-base-dev
      registry_name: crcoderatsbasedev9e0045
    secrets: inherit
