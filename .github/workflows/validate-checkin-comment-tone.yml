name: Validate check-in and comment text tones
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-checkin-comment-tone.yml"
permissions:
  contents: read
jobs:
  frontend:
    name: Verify limited frontend visual change
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 40
    steps:
      - name: Issue short-lived read-only private repository token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          owner: coderats-hub
          repositories: web-coderats-base
          permission-contents: read
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: coderats-hub/web-coderats-base
          ref: aaabaf9d2a7814796c3f4b19a9d5a52cf3bffcc9
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
          path: app-src
      - name: Verify pinned SHA
        run: test "$(git -C app-src rev-parse HEAD)" = "aaabaf9d2a7814796c3f4b19a9d5a52cf3bffcc9"
      - name: Verify exact content and comment text tone only
        working-directory: app-src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          tone='color-mix(in srgb, var(--color-text-primary) 42%, var(--color-text-secondary))'
          feed=Path('styles/feed.css').read_text()
          composer=Path('styles/check-in.css').read_text()
          for name in ('.activity-content', '.activity-comment-body > p', '.activity-comment-input'):
            pattern=re.compile(re.escape(name)+r'\s*\{([^}]*)\}')
            match=pattern.search(feed)
            assert match is not None and ('color: '+tone+';') in match.group(1), name
          for name in ('.composer-dialog .check-in-content', '.check-in-inline .check-in-content'):
            pattern=re.compile(re.escape(name)+r'\s*\{([^}]*)\}')
            match=pattern.search(composer)
            assert match is not None and ('color: '+tone+';') in match.group(1), name
          assert '.activity-comment-author { font-weight:' in feed
          assert '.activity-comments-header h3 { font-size:' in feed
          print('Targeted text tone and title/author selector safeguards passed')
          PY
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run frontend tests, TypeScript and production build
        working-directory: app-src
        env:
          NEXT_PUBLIC_API_URL: https://coderats.club
          API_PROXY_TARGET: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/deps.log" 2>&1 || { echo "::error::Dependency installation failed"; exit 1; }
          npm test > "$RUNNER_TEMP/tests.log" 2>&1 || { echo "::error::Frontend tests failed"; exit 1; }
          npx tsc --noEmit > "$RUNNER_TEMP/types.log" 2>&1 || { echo "::error::TypeScript validation failed"; exit 1; }
          npm run build -- --webpack > "$RUNNER_TEMP/build.log" 2>&1 || { echo "::error::Frontend production build failed"; exit 1; }
          echo "CSS assertions, Vitest, TypeScript and Next.js production build: PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private checkout
        if: always()
        run: rm -rf app-src
