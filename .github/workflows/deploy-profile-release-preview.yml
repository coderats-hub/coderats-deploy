name: Deploy profile release preview to DEV

# Isolated release of tested public-colony visibility frontend from develop (pinned SHA).
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-profile-release-preview.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: coderats-central-dev-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Release profile frontend to DEV
    if: >-
      github.repository == 'coderats-hub/coderats-deploy' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'ci(dev): deploy profile release source'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 70
    steps:
      - name: Check expected protected scope
        env:
          GITHUB_APP_ID: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          GITHUB_APP_KEY: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          APP: ${{ vars.AZURE_WEB_CONTAINER_APP }}
          API_ORIGIN: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          for key in GITHUB_APP_ID GITHUB_APP_KEY CLIENT_ID TENANT_ID SUBSCRIPTION_ID APP API_ORIGIN; do
            [[ -n "${!key}" ]] || { echo "::error::Missing required protected DEV configuration: $key"; exit 1; }
          done
          [[ "$APP" =~ ^[a-z0-9-]+-dev$ && "$APP" == *web* ]] || exit 1
          [[ "$API_ORIGIN" == https://* ]] || exit 1
      - name: Issue read-only token for private frontend only
        id: access
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          owner: coderats-hub
          repositories: web-coderats-base
          permission-contents: read
      - name: Checkout exact tested frontend release SHA
        uses: actions/checkout@v4
        with:
          repository: coderats-hub/web-coderats-base
          ref: ac30c2ed864a79c11d46016f4ab941ee87157b95
          token: ${{ steps.access.outputs.token }}
          persist-credentials: false
          fetch-depth: 1
          path: app-src
      - name: Confirm private source commit
        run: |
          set -euo pipefail
          test "$(git -C app-src rev-parse HEAD)" = ac30c2ed864a79c11d46016f4ab941ee87157b95
      - name: Prepare Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install private frontend dependencies
        working-directory: app-src
        run: |
          set -euo pipefail
          if ! npm ci --no-audit --no-fund >"$RUNNER_TEMP/private-release-npm.log" 2>&1; then
            echo "::error::Frontend dependency installation failed. Private logs suppressed."
            exit 1
          fi
      - name: Run private frontend tests
        working-directory: app-src
        env:
          NEXT_PUBLIC_API_URL: https://coderats.club
          API_PROXY_TARGET: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if ! npm test -- --reporter=json --outputFile="$RUNNER_TEMP/private-release-results.json" >"$RUNNER_TEMP/private-release-tests.log" 2>&1; then
            echo "::error::Frontend unit tests failed. Private logs suppressed."
            python3 - "$RUNNER_TEMP/private-release-results.json" <<'PY'
          import json, os, pathlib, sys, re
          allowed = {"feed.test.tsx", "shell-search.test.tsx", "member-search.test.ts"}
          try:
              report = json.loads(pathlib.Path(sys.argv[1]).read_text())
              print("Sanitized Vitest run:", {
                  "success": bool(report.get("success")),
                  "total": report.get("numTotalTests", -1),
                  "passed": report.get("numPassedTests", -1),
                  "suites": len(report.get("testResults", [])),
                  "pending": report.get("numPendingTests", -1),
                  "unhandled": len(report.get("unhandledErrors", [])),
                  "suite_errors": sum(bool(t.get("message")) for t in report.get("testResults", [])),
              })

              for suite in report.get("testResults", []):
                  file_name = os.path.basename(suite.get("name",""))
                  failures = [t for t in suite.get("assertionResults",[]) if t.get("status")=="failed"]
                  if failures:
                      label = file_name if re.fullmatch(r"[A-Za-z0-9._-]{1,100}\.test\.tsx?", file_name) else "another-private-test"
                      print(f"Sanitized Vitest suite={label} failed={len(failures)}")
                      if file_name == "member-social.test.tsx":
                          for failed in failures:
                              name=str(failed.get("fullName",""))
                              category=(
                                  "OWN_FOLLOWING_POPUP" if "own following list" in name else
                                  "OTHER_PROFILE_FOLLOWERS" if "another member followers" in name else
                                  "OWN_METRICS" if "own profile" in name else
                                  "FOLLOW_BLOCK_CONTROLS" if "follows, unfollows" in name else "OTHER")
                              print(f"Sanitized member-social case={category}")
                              for failure in failed.get("failureMessages", [])[:1]:
                                  if not isinstance(failure, str): continue
                                  matches=re.findall(r"member-social\.test\.tsx:(\d+):\d+",failure)
                                  if matches:
                                      print(f"Sanitized member-social test_line={matches[-1]}")
                                  reason=("MISSING_BUTTON" if "Unable to find an accessible element with the role" in failure else
                                          "MISSING_TEXT" if "Unable to find an element with the text" in failure else
                                          "MULTIPLE_ELEMENTS" if "Found multiple elements" in failure else
                                          "EXPECTATION_FAILED" if "AssertionError" in failure else "OTHER")
                                  print(f"Sanitized member-social failure_kind={reason}")
                  if file_name == "dm-management.test.tsx":
                      for failed in failures:
                          title=str(failed.get("fullName", ""))
                          case=("GROUP" if "multi-member" in title else "SEND" if "sends immediately" in title else "OTHER")
                          print(f"Sanitized DM management case={case}")
                          for failure in failed.get("failureMessages", [])[:1]:
                              if not isinstance(failure, str): continue
                              why=("DUPLICATE" if "Found multiple elements" in failure else
                                   "MISSING_ROLE" if "Unable to find an accessible element" in failure else
                                   "MISSING_TEXT" if "Unable to find an element with the text" in failure else
                                   "EXPECTATION" if "AssertionError" in failure else
                                   "REQUEST" if "Unexpected route" in failure else "OTHER")
                              print(f"Sanitized DM management failure={why}")
                              positions=re.findall(r"dm-management\.test\.tsx:(\d+):\d+", failure)
                              if positions: print(f"Sanitized DM management test_line={positions[-1]}")
                  if file_name == "direct-messages.test.tsx":
                      for failed in failures:
                          for failure in failed.get("failureMessages", [])[:1]:
                              if not isinstance(failure, str): continue
                              reason=("MULTIPLE_ELEMENTS" if "Found multiple elements" in failure else
                                      "MISSING_BUTTON" if "Unable to find an accessible element with the role" in failure else
                                      "MISSING_TEXT" if "Unable to find an element with the text" in failure else
                                      "ASSERTION" if "AssertionError" in failure else
                                      "SCROLL_METHOD" if "scrollIntoView" in failure else
                                      "CRYPTO_UUID" if "randomUUID" in failure else
                                      "TYPE_ERROR" if "TypeError" in failure else
                                      "REACT_ERROR" if "React" in failure else "OTHER")
                              print(f"Sanitized direct-message test failure_kind={reason}")
                              positions=re.findall(r"direct-messages\\.test\\.tsx:(\\d+):\\d+", failure)
                              if positions: print(f"Sanitized direct-message test_line={positions[-1]}")
                  elif suite.get("status")=="failed":
                      label = file_name if re.fullmatch(r"[A-Za-z0-9._-]{1,100}\.test\.tsx?", file_name) else "another-private-test"
                      print(f"Sanitized Vitest suite={label} failed_at_suite_level")
              print(f"Sanitized Vitest totals failed_tests={report.get('numFailedTests','unknown')}, failed_suites={report.get('numFailedTestSuites','unknown')}")
          except (ValueError, OSError, TypeError, KeyError):
              print("Sanitized Vitest report unavailable")
          PY
            exit 1
          fi
      - name: Typecheck private frontend
        working-directory: app-src
        env:
          NEXT_PUBLIC_API_URL: https://coderats.club
          API_PROXY_TARGET: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if ! npx tsc --noEmit >"$RUNNER_TEMP/private-release-types.log" 2>&1; then
            echo "::error::Frontend TypeScript check failed. Sanitized diagnostics follow."
            python3 - "$RUNNER_TEMP/private-release-types.log" <<'PY'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          allowed = {'direct-messages.tsx', 'contract.ts', 'direct-messages.test.tsx', 'dm-contract.test.ts'}
          for line in lines:
              m = re.search(r'([A-Za-z0-9._-]+\.tsx?)\((\d+),(\d+)\): error (TS\d+)', line)
              if m:
                  filename, row, col, code = m.groups()
                  print('Sanitized TypeScript:', filename if filename in allowed else 'another-file', row, col, code)
          PY
            exit 1
          fi
      - name: Build private frontend
        working-directory: app-src
        env:
          NEXT_PUBLIC_API_URL: https://coderats.club
          API_PROXY_TARGET: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          if ! npm run build -- --webpack >"$RUNNER_TEMP/private-release-build.log" 2>&1; then
            echo "::error::Frontend Next.js build failed. Private logs suppressed."
            exit 1
          fi
          echo "Private release tests, types and build passed." >> "$GITHUB_STEP_SUMMARY"
      - name: Azure login on public deployment owner
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build pinned release image and publish to DEV
        env:
          EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          WEB_APP: ${{ vars.AZURE_WEB_CONTAINER_APP }}
          API_ORIGIN: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          rg=rg-coderats-base-dev
          registry=crcoderatsbasedev9e0045
          [[ "$(az account show --query id -o tsv)" == "$EXPECTED_SUBSCRIPTION" ]] || exit 1
          [[ "$(az group show -n "$rg" --query name -o tsv)" == "$rg" ]] || exit 1
          [[ "$(az acr show -n "$registry" -g "$rg" --query loginServer -o tsv)" == "$registry.azurecr.io" ]] || exit 1
          [[ "$WEB_APP" =~ ^[a-z0-9-]+-dev$ && "$WEB_APP" == *web* ]] || exit 1
          az containerapp show -g "$rg" -n "$WEB_APP" --query name -o tsv >/dev/null
          image="$registry.azurecr.io/web-coderats-base:ac30c2ed864a79c11d46016f4ab941ee87157b95-$GITHUB_RUN_ID"
          az acr login -n "$registry" --output none
          log="$RUNNER_TEMP/private-release-docker.log"
          if ! docker build -f app-src/Dockerfile --build-arg "NEXT_PUBLIC_API_URL=https://coderats.club" --build-arg "API_PROXY_TARGET=$API_ORIGIN" -t "$image" app-src >"$log" 2>&1; then
            echo "::error::Private frontend Docker build failed. Private logs suppressed."
            exit 1
          fi
          if ! docker push "$image" >"$log" 2>&1; then
            echo "::error::Image push to restricted DEV ACR failed."
            exit 1
          fi
          az containerapp update -g "$rg" -n "$WEB_APP" --image "$image" --output none
          fqdn="$(az containerapp show -g "$rg" -n "$WEB_APP" --query properties.configuration.ingress.fqdn -o tsv)"
          [[ "$fqdn" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          for i in $(seq 1 30); do
            current="$(az containerapp show -g "$rg" -n "$WEB_APP" --query properties.template.containers[0].image -o tsv)"
            latest="$(az containerapp show -g "$rg" -n "$WEB_APP" --query properties.latestRevisionName -o tsv)"
            ready="$(az containerapp show -g "$rg" -n "$WEB_APP" --query properties.latestReadyRevisionName -o tsv)"
            if [[ "$current" == "$image" && -n "$latest" && "$latest" == "$ready" ]] &&
               curl --fail --silent --show-error --max-time 12 "https://$fqdn/health" >/dev/null 2>&1; then
              echo "## Frontend release publicado em DEV" >> "$GITHUB_STEP_SUMMARY"
              echo "Branch: \`develop\`" >> "$GITHUB_STEP_SUMMARY"
              echo "Commit: \`ac30c2ed864a79c11d46016f4ab941ee87157b95\`" >> "$GITHUB_STEP_SUMMARY"
              echo "Revisão Azure: \`$ready\`" >> "$GITHUB_STEP_SUMMARY"
              echo "Ver perfil: https://$fqdn/app/profile" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Released frontend did not reach healthy ready revision"
          exit 1
      - name: Smoke test first-party OAuth session and API on coderats.club
        run: |
          set -euo pipefail
          # Never log OAuth state, client IDs, sessions or response headers.
          # API and web are deployed by distinct jobs; allow the API rollout
          # to finish before asserting the public callback.
          for attempt in $(seq 1 45); do
            headers="$RUNNER_TEMP/first-party-oauth-headers"
            code="$(curl --silent --show-error --max-time 12 -o /dev/null -D "$headers" -w '%{http_code}' https://coderats.club/oauth2/authorization/github || true)"
            auth_status="$(curl --silent --show-error --max-time 12 -o /dev/null -w '%{http_code}' https://coderats.club/api/v1/auth/me || true)"
            if [[ "$code" == "302" && "$auth_status" == "401" ]] &&
               python3 - "$headers" <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qs
          import sys
          lines=Path(sys.argv[1]).read_text(errors="replace").splitlines()
          locs=[line.split(":",1)[1].strip() for line in lines if line.lower().startswith("location:")]
          cookies=[line.split(":",1)[1].strip() for line in lines if line.lower().startswith("set-cookie:")]
          if not locs:sys.exit(1)
          redirect=urlsplit(locs[-1])
          callback=parse_qs(redirect.query).get("redirect_uri",[None])[0]
          first_party=any(c.lower().startswith("jsessionid=") and "secure" in c.lower()
              and "httponly" in c.lower()
              and "domain=" not in c.lower() for c in cookies)
          if redirect.hostname!="github.com" or callback!="https://coderats.club/login/oauth2/code/github" or not first_party:
              sys.exit(1)
          PY
            then
              echo "First-party OAuth callback, host-only session cookie and API proxy smoke passed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::First-party public OAuth session smoke failed; check proxy and API callback"
          exit 1
      - name: Remove checked-out private source and logout
        if: always()
        run: |
          rm -rf app-src || true
          az logout >/dev/null 2>&1 || true
