name: CodeRats DEV API baseline benchmark
on:
  push:
    branches: [main]
    paths:
      - 'observability/workbooks/**'
      - '.github/workflows/benchmark-dev.yml'
  workflow_dispatch:
    inputs:
      service:
        description: Service to sample safely
        required: true
        type: choice
        options: [web, api, grader]
      confirmation:
        description: Type BENCHMARK_DEV
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: coderats-dev-benchmark
  cancel-in-progress: false
jobs:
  baseline:
    if: >-
      github.repository == 'coderats-hub/coderats-deploy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'BENCHMARK_DEV') ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci(dev): provision observability and benchmark')))
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, grader]
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' || matrix.service == inputs.service
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: github.event_name == 'push' || matrix.service == inputs.service
        with:
          python-version: '3.12'
      - name: Azure login read-only DEV FQDN discovery
        if: github.event_name == 'push' || matrix.service == inputs.service
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Discover DEV service endpoint from deployed Container App
        if: github.event_name == 'push' || matrix.service == inputs.service
        env:
          SERVICE: ${{ matrix.service }}
          WEB_APP: ${{ vars.AZURE_WEB_CONTAINER_APP }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          [[ "$(az account show --query id -o tsv)" == "$SUBSCRIPTION_ID" ]] || exit 1
          case "$SERVICE" in
            web) app="$WEB_APP";;
            api) app="ca-coderats-base-api-dev";;
            grader) app="ca-coderats-grader-dev";;
            *) exit 1;;
          esac
          [[ "$app" =~ ^[a-zA-Z0-9-]+$ ]] || { echo "::error::Invalid DEV app name"; exit 1; }
          fqdn="$(az containerapp show -g rg-coderats-base-dev -n "$app" --query properties.configuration.ingress.fqdn -o tsv)"
          [[ "$fqdn" =~ ^[a-zA-Z0-9.-]+[.]azurecontainerapps[.]io$ ]] || {
            echo "::error::DEV service has no expected ingress domain"; exit 1;
          }
          if [[ "$fqdn" == *".internal."* ]]; then
            [[ "$SERVICE" == "grader" ]] || { echo "::error::Unexpected internal ingress"; exit 1; }
            echo "SERVICE_INTERNAL=true" >> "$GITHUB_ENV"
            echo "GRADER_APP=$app" >> "$GITHUB_ENV"
            echo "::notice::Grader has private ingress; public HTTP probing intentionally disabled."
          else
            echo "SERVICE_INTERNAL=false" >> "$GITHUB_ENV"
            echo "TARGET_URL=https://$fqdn" >> "$GITHUB_ENV"
          fi
      - name: Collect bounded, read-only latency baseline
        if: (github.event_name == 'push' || matrix.service == inputs.service) && env.SERVICE_INTERNAL != 'true'
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          SERVICE: ${{ matrix.service }}
        run: python3 scripts/benchmark_dev.py --service "$SERVICE" --base-url "$TARGET_URL" --requests 15 --output benchmark-results.json
      - name: Verify private Grader's Azure revision readiness
        if: (github.event_name == 'push' || matrix.service == inputs.service) && env.SERVICE_INTERNAL == 'true'
        env:
          GRADER_APP: ${{ env.GRADER_APP }}
        run: |
          set -euo pipefail
          latest="$(az containerapp show -g rg-coderats-base-dev -n "$GRADER_APP" --query properties.latestRevisionName -o tsv)"
          ready="$(az containerapp show -g rg-coderats-base-dev -n "$GRADER_APP" --query properties.latestReadyRevisionName -o tsv)"
          if [[ -z "$latest" || "$latest" != "$ready" ]]; then
            echo "::error::Private Grader DEV revision is not ready"; exit 1
          fi
          echo "### Grader DEV internal readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest revision is ready. The Grader has private ingress, so HTTP latency cannot be measured from a public runner." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Private Grader Azure revision is ready. No HTTP requests were sent."
      - name: Record public, aggregated benchmark summary only
        if: (github.event_name == 'push' || matrix.service == inputs.service) && always()
        run: |
          if [[ -f benchmark-results.json ]]; then
            python3 - <<'PY'
          import json,os
          d=json.load(open('benchmark-results.json'))
          m=d['results']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"### {d['service']} DEV health benchmark\n\n")
              f.write(f"Requests: {m['count']}; errors: {m['errors']}; p50: {m['p50_ms']} ms; p95: {m['p95_ms']} ms.\n")
              f.write("\n**This is a low-volume health baseline, not an end-to-end/call-reduction benchmark.**\n")
          PY
          fi
      - name: Upload aggregated read-only measurements
        if: (github.event_name == 'push' || matrix.service == inputs.service) && env.SERVICE_INTERNAL != 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: coderats-dev-benchmark-${{ matrix.service }}
          path: benchmark-results.json
          retention-days: 14
