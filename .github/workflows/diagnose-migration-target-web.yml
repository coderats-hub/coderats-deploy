          for p in /health /api/v1/auth/me; do
            status="$(curl -sS -o /dev/null --max-redirs 0 --connect-timeout 7 --max-time 15 \
              -w '%{http_code}' "https://$web_fqdn$p" 2>/dev/null || true)"
            [[ "$status" =~ ^[0-9]{3}$ ]] || status=unavailable
            echo "- Web $p HTTP without redirects: $status" >> "$GITHUB_STEP_SUMMARY"
          done
          logfile="$RUNNER_TEMP/web-https-console-private.log"
          if az containerapp logs show -g "$RG" -n "$WEB" --subscription "$SID" \
            --type console --tail 200 --only-show-errors > "$logfile" 2>&1; then
            LOGFILE="$logfile" python3 - <<'PY'
          import os,re
          s=open(os.environ["LOGFILE"],errors="replace").read().lower()
          classes={
            "dns":r"enotfound|eai_again|getaddrinfo",
            "tls-cert":r"unable_to_verify_leaf_signature|unable_to_get_issuer_cert|err_tls_cert_altname_invalid|self.signed.certificate|certificate verify|certificate.*expired|cert_has_expired",
            "tls-handshake":r"eproto|tls handshake|ssl routines|wrong version number|alert bad certificate|tlsv1 alert",
            "proxy-connect":r"econnrefused|econnreset|etimedout|socket hang up|fetch failed|proxy error|und_err",
            "server":r"typeerror:|referenceerror:|internalservererror|status=500",
            "redirect":r"status=301|permanent redirect|redirected|moved permanently"
          }
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Web HTTPS proxy recent console signals\n")
              for name,p in classes.items():
                  f.write("- "+name+"="+str(min(999,len(re.findall(p,s))))+"\n")
              f.write("- Raw console text and response bodies withheld\n")
          PY
          else
            echo "- Web console diagnostic unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/web-https-arm-private.json" \
            "$RUNNER_TEMP/web-https-revisions-private.json" "$logfile"

      - name: Print safe summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$GITHUB_STEP_SUMMARY" ]]; then cat "$GITHUB_STEP_SUMMARY"; fi
          rm -f "$RUNNER_TEMP/revisions.json" "$RUNNER_TEMP/mirror-arm-events.json"
          az logout --output none >/dev/null 2>&1 || true
