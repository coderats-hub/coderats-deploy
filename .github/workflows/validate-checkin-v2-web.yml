# Validate the approved Check-in V2 frontend change from an immutable private source SHA.
# Test-only. No Azure login, production change, or deploy happens in this workflow.
name: Validate Check-in V2 Web (central CI)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-checkin-v2-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'coderats-hub/coderats-deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: migration-target
    timeout-minutes: 40
    steps:
      - name: Confirm read-only source checkout credentials
        env:
          APP_ID: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          APP_KEY: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_ID" && test -n "$APP_KEY"
      - name: Read-only GitHub App token for Web
        id: source-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          owner: coderats-hub
          repositories: web-coderats-base
          permission-contents: read
      - name: Checkout exact reviewed private Web commit
        uses: actions/checkout@v4
        with:
          repository: coderats-hub/web-coderats-base
          ref: 1cfe37458656cd29f2e656adccd79d1e7d14f016
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: app-src
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Web checks privately (unit, websocket, types, build)
        working-directory: app-src
        env:
          NEXT_PUBLIC_API_URL: https://coderats.club
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/private-web-validation.log"
          for stage in install test websocket types build; do
            case "$stage" in
              install) command=(npm ci --no-audit --no-fund) ;;
              test) command=(npm test -- --reporter=json "--outputFile=${RUNNER_TEMP}/private-web-test-report.json") ;;
              websocket) command=(npm run test:ws) ;;
              types) command=(npx --no-install tsc --noEmit) ;;
              build) command=(npm run build -- --webpack) ;;
            esac
            if ! "${command[@]}" >"$log_file" 2>&1; then
              if [[ "$stage" == test && -s "${RUNNER_TEMP}/private-web-test-report.json" ]]; then
                python3 - "${RUNNER_TEMP}/private-web-test-report.json" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding='utf-8'))
              suites = sorted(data.get('testResults', []), key=lambda s: s.get('name', ''))
              print('Sanitized test outcome: files=', len(suites),
                    'failed=', data.get('numFailedTests', 'unknown'))
              for idx, suite in enumerate(suites, 1):
                  if suite.get('status') != 'failed':
                      continue
                  tests = suite.get('assertionResults') or []
                  failed = [str(n) for n, test in enumerate(tests, 1) if test.get('status') == 'failed']
                  print('Failed suite ordinal', idx, 'test ordinals', ','.join(failed) or 'unknown')
          except (OSError, ValueError, TypeError):
              print('Test reporter parsing failed (no private logs exposed)')
          PY
              fi
              echo "::error::Private Web validation failed at stage: $stage"
              exit 1
            fi
            echo "Passed stage: $stage"
          done
          echo "Private Web validation passed at immutable source SHA"
      - name: Remove private source and logs
        if: always()
        run: |
          rm -rf app-src
          rm -f "${RUNNER_TEMP}/private-web-validation.log" "${RUNNER_TEMP}/private-web-test-report.json"
