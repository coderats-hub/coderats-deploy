# Archived after coderats.club moved to the new Azure subscription on 2026-11-11.
# The previous pinned release targeted the exhausted legacy Azure subscription.
# It is deliberately non-deploying; historical implementation remains in Git history.
name: "Retired legacy old profile-only Web candidate release"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse legacy Azure deployment
        run: |
          echo "::error::This legacy workflow is retired. Use deploy-private-dev.yml (web) with environment migration-target."
          exit 1
