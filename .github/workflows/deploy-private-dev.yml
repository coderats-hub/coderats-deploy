name: Deploy CodeRats web and API to official Azure (CodeRats Club)

# The current production domain is coderats.club on the migration-target Azure subscription.
# GET remains disabled until its target job has DB credentials and a dedicated approval.
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-private-dev.yml"]
  workflow_dispatch:
    inputs:
      service:
        description: CodeRats service to deploy to official Azure
        required: true
        type: choice
        options: [web, api]
      confirmation:
        description: Type DEPLOY_DEV to authorize production release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: "coderats-official-${{ github.event_name == 'push' && (github.event.head_commit.message == 'ci(migration): release target web' && 'web' || github.event.head_commit.message == 'ci(migration): release target api' && 'api') || inputs.service }}"
  cancel-in-progress: false

jobs:
  deploy:
    name: "Release ${{ github.event_name == 'push' && (github.event.head_commit.message == 'ci(migration): release target web' && 'web' || github.event.head_commit.message == 'ci(migration): release target api' && 'api') || inputs.service }} to official Azure"
    if: >-
      github.repository == 'coderats-hub/coderats-deploy' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.event.head_commit.message == 'ci(migration): release target web' ||
         github.event.head_commit.message == 'ci(migration): release target api')))
    environment: migration-target
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      DEPLOY_SERVICE: "${{ github.event_name == 'push' && (github.event.head_commit.message == 'ci(migration): release target web' && 'web' || github.event.head_commit.message == 'ci(migration): release target api' && 'api') || inputs.service }}"
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate intent and constrain private checkout
        id: target
        env:
          SERVICE: ${{ env.DEPLOY_SERVICE }}
          CONFIRMATION: ${{ github.event_name == 'push' && 'DEPLOY_DEV' || inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "DEPLOY_DEV" ]] || {
            echo "::error::Confirmation must be DEPLOY_DEV"; exit 1;
          }
          case "$SERVICE" in
            web)        repo=web-coderats-base; branch=develop ;;
            api)        repo=api-coderats-base; branch=develop ;;
            *) echo "::error::Invalid service"; exit 1 ;;
          esac
          echo "repo_name=$repo" >> "$GITHUB_OUTPUT"
          echo "repo=coderats-hub/$repo" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Check required protected DEV credentials before private checkout
        env:
          GITHUB_APP_ID: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          GITHUB_APP_KEY: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for key in GITHUB_APP_ID GITHUB_APP_KEY AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!key}" ]] || { echo "::error::Missing DEV environment configuration: $key"; exit 1; }
          done

      - name: Issue short-lived GitHub App token for exactly one private repo
        id: private-token
        if: env.DEPLOY_SERVICE != 'get-worker'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          owner: coderats-hub
          repositories: ${{ steps.target.outputs.repo_name }}
          permission-contents: read

      - name: Checkout the PRIVATE source from its trusted branch
        uses: actions/checkout@v4
        if: env.DEPLOY_SERVICE != 'get-worker'
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.branch }}
          token: ${{ steps.private-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 1
          path: app-src

      - name: Record the private source SHA for reproducible image tag
        id: source
        if: env.DEPLOY_SERVICE != 'get-worker'
        run: |
          set -euo pipefail
          sha="$(git -C app-src rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Prepare Node 24 for private web checks
        if: env.DEPLOY_SERVICE == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test and typecheck private frontend without publishing its logs
        if: env.DEPLOY_SERVICE == 'web'
        working-directory: app-src
        env:
          NEXT_PUBLIC_API_URL: https://coderats.club
          API_PROXY_TARGET: https://ca-cdmstd-api-c26m0911.internal.victoriousocean-99a629e7.brazilsouth.azurecontainerapps.io
        run: |
          set -euo pipefail
          [[ "$NEXT_PUBLIC_API_URL" == https://* ]] || { echo "::error::Missing valid DEV API origin"; exit 1; }
          runlog="${RUNNER_TEMP}/coderats-web-checks.log"
          # Do not reveal private test output in this public repository.
          # Expose only which verification stage failed.
          if ! npm ci --no-audit --no-fund >"$runlog" 2>&1; then
            echo "::error::Private web validation failed: dependency installation."
            exit 1
          fi
          if ! npm test -- --reporter=json --outputFile="$RUNNER_TEMP/coderats-test-report.json" >"$runlog" 2>&1; then
            echo "::error::Private web validation failed: unit tests."
            # Only broad, predetermined component areas may leave the private runner.
            # Never echo private source, test titles, assertions, paths or raw logs.
            python3 - "$runlog" <<'PY'
          import pathlib, re, sys
          content = pathlib.Path(sys.argv[1]).read_text(errors='replace')
          areas = {
              'feed.test.tsx': 'community-feed',
              'feed-interactions.test.tsx': 'comment-interactions',
              'notifications.test.tsx': 'notifications',
              'accessibility.test.tsx': 'accessibility',
              'dm-colony-enhancements.test.ts': 'chat-colony-contract',
              'dm-contract.test.ts': 'chat-parser-contract',
              'dm-management.test.tsx': 'chat-management-ui',
              'direct-messages.test.tsx': 'chat-inbox-ui',
              'dm-colony-owner.test.tsx': 'chat-owner-ui',
              'resource-suspense.test.tsx': 'card-suspense',
              'streak.test.tsx': 'streak-card',
              'profile.test.tsx': 'profile-ui',
              'profile-cache.test.tsx': 'profile-cache',
              'profile-preview.test.tsx': 'profile-preview',
              'community-insights.test.tsx': 'colony-progress-card',
              'get-technical-identity.test.tsx': 'technical-identity',
              'get-themed-badges.test.tsx': 'achievement-cards',
              'get-checkin-milestones.test.tsx': 'achievement-milestones',
              'ratings-visualization.test.tsx': 'ratings-cards',
          }
          matched = set()
          for line in content.splitlines():
              if 'FAIL ' in line or ('❯' in line and 'failed' in line.lower()):
                  for filename, area in areas.items():
                      if re.search(r'(?:^|/)'+re.escape(filename)+r'\b', line):
                          matched.add(area)
          print('Sanitized frontend failure area:', ','.join(sorted(matched)) if matched else 'other-or-unavailable')
          signatures = {
              'module_resolution': r'Cannot find module|Failed to resolve import|Failed to load url|No matching export',
              'module_initialization': r'Error when evaluating SSR module|ReferenceError:|SyntaxError:',
              'runtime_type': r'TypeError:',
              'expectation': r'AssertionError:|Unable to find|expected .* to ',
              'transform': r'Transform failed|Unexpected token|Parse failure',
          }
          print('Sanitized frontend failure kinds:', ','.join(k for k, v in signatures.items() if re.search(v, content)) or 'unclassified')
          # Only safe, allowlisted test file categories and failure indices; no assertion text.
          import json
          try:
              report=json.loads(pathlib.Path(__import__('os').environ['RUNNER_TEMP'], 'coderats-test-report.json').read_text())
              allow = {
                  'profile.test.tsx': 'profile-ui',
                  'get-technical-identity.test.tsx': 'technical-identity',
                  'ratings-visualization.test.tsx': 'ratings-cards',
                  'profile-preview.test.tsx': 'profile-preview',
                  'checkin-feed-view.test.tsx': 'checkin-view',
                  'check-in-visualization-beta.test.tsx': 'checkin-presentation',
                  'organizations-ui.test.tsx': 'organizations',
                  'colony-detail.test.tsx': 'colony-detail',
                  'feed.test.tsx': 'community-feed',
                  'get-themed-badges.test.tsx': 'achievement-cards',
                  'profile-cache.test.tsx': 'profile-cache',
                  'accessibility.test.tsx': 'accessibility',
              }
              # An ordinal in the sorted test filename inventory identifies an unknown suite without revealing its path.
              inventory = sorted([p.name for p in pathlib.Path('tests').glob('*.test.ts*')])
              for suite in report.get('testResults',[]):
                  failing = [i+1 for i,t in enumerate(suite.get('assertionResults',[])) if t.get('status') == 'failed']
                  if failing or suite.get('status')=='failed':
                      name=pathlib.Path(suite.get('name','')).name
                      area=allow.get(name,'other-test')
                      numbers=','.join(str(i) for i in failing[:20]) if failing else 'suite-level'
                      print('Sanitized failed suite:',area,'file-ordinal:',(inventory.index(name)+1) if name in inventory else 0,'test-ordinals:',numbers)
              print('Sanitized failed test count:',report.get('numFailedTests','unknown'))
          except (OSError,ValueError,TypeError,KeyError):
              print('Sanitized JSON report: unavailable')

          # Ordinal-only diagnostics: identify stale profile tests without exposing private titles or assertions.
          profile_test = pathlib.Path('tests/profile.test.tsx')
          if profile_test.is_file():
              titles = re.findall(r"^it\('([^']+)'", profile_test.read_text(errors='replace'), re.M)
              failure_lines = [line for line in content.splitlines() if 'FAIL ' in line or '❯ ' in line]
              positions = sorted({index for index, title in enumerate(titles, 1)
                                  if any(title in line for line in failure_lines)})
              if positions:
                  print('Sanitized profile test ordinals:', ','.join(map(str, positions)))
          for label, pattern in [('chat_component', r'direct-messages\.tsx:(\d+):(\d+)'),
                                 ('dm_contract', r'contract\.ts:(\d+):(\d+)')]:
              match = re.search(pattern, content)
              if match:
                  print('Sanitized frontend location:', label, *match.groups())
          for label, phrase in [('transform_failed', 'Transform failed'),
                                ('unexpected_token', 'Unexpected token'),
                                ('parse_failure', 'Parse failure')]:
              if phrase in content:
                  print('Sanitized frontend transform marker:', label)
          PY
            exit 1
          fi
          # A WebSocket upgrade must be proxied before Next.js routing; fail closed
          # before publishing if the standalone gateway integration test regresses.
          if ! npm run test:ws >"$runlog" 2>&1; then
            echo "::error::Private web validation failed: WebSocket gateway checks."
            exit 1
          fi
          if ! npx tsc --noEmit >"$runlog" 2>&1; then
            echo "::error::Private web validation failed: TypeScript."
            python3 - "$runlog" <<'PY'
          import pathlib, re, sys
          content = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          codes = re.findall(r"error (TS[0-9]+)", content)
          print("Sanitized TypeScript error counts:", {k: codes.count(k) for k in sorted(set(codes))})
          # Diagnose by numeric file ordinal and source position, never emit code or private paths.
          inventory = sorted(str(p) for folder in ('app','components','lib','tests') for p in pathlib.Path(folder).rglob('*.ts*') if p.is_file())
          allowed = {
              'public-member-page.test.tsx': 'public-profile-tests',
              'member-profile.tsx': 'member-profile',
              'technical-identity.tsx': 'technical-identity',
              'profile-dashboard.tsx': 'profile-dashboard',
              'checkin-grid.tsx': 'checkin-grid',
              'check-in-history.tsx': 'check-in-history',
              'colony-feed.tsx': 'colony-feed',
              'organizations-ui.test.tsx': 'orgs-tests',
              'page.tsx': 'page-component',
          }
          for line in content.splitlines():
              m=re.search(r'^(.*?)\((\d+),(\d+)\): error (TS\d+):',line)
              if m:
                  path,row,col,code=m.groups()
                  ordinal=(inventory.index(path)+1) if path in inventory else 0
                  print('Sanitized TypeScript location:',allowed.get(pathlib.Path(path).name,'other'),'file-ordinal:',ordinal,'line:',row,'column:',col,'code:',code)

          PY
            exit 1
          fi
          if ! npm run build -- --webpack >"$runlog" 2>&1; then
            echo "::error::Private web validation failed: Next build."
            exit 1
          fi
          echo "Private frontend validation passed."

      - name: Prepare Java 21 for private API checks
        if: env.DEPLOY_SERVICE == 'api'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify private API without publishing test output
        if: env.DEPLOY_SERVICE == 'api'
        working-directory: app-src
        run: |
          set -euo pipefail
          runlog="${RUNNER_TEMP}/coderats-api-checks.log"
          if ! (chmod +x mvnw && ./mvnw --batch-mode verify) >"$runlog" 2>&1; then
            echo "::error::Private Java verification failed. Sanitized diagnostics follow."
            # Never print the raw Maven output from a private repository in
            # a public workflow. Only known Maven compiler/test markers are
            # surfaced, with paths and arbitrary failure messages omitted.
            python3 - "$runlog" <<'PY'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          errors = [l for l in lines if '[ERROR]' in l]
          kinds = {
              'compiler_error': sum(bool(re.search(r'\.java:\[\d+,\d+\]', x)) for x in errors),
              'test_failures': sum('Tests run:' in x or 'Failures:' in x for x in errors),
              'build_goal_failures': sum('Failed to execute goal' in x for x in errors),
          }
          print('Maven failure categories:', kinds)
          for category, term in [
              ('SQL_GRAMMAR', 'BadSqlGrammarException'),
              ('H2_SQL_SYNTAX', 'JdbcSQLSyntaxErrorException'),
              ('POSTGRES_SQL', 'PSQLException'),
              ('DATA_INTEGRITY', 'DataIntegrityViolationException'),
              ('EMPTY_RESULT', 'EmptyResultDataAccessException'),
              ('NULL_POINTER', 'NullPointerException'),
              ('INVALID_QUERY', 'InvalidDataAccessResourceUsageException'),
              ('FLYWAY', 'FlywayException'),
              ('APPLICATION_CONTEXT', 'Failed to load ApplicationContext'),
          ]:
              if any(term in l for l in lines):
                  print('Sanitized API error category:', category)

          # Strict diagnostic classification, no application log lines or private stack traces.
          for marker in ['FlywayMigrationIntegrationTest', 'GitHubTokenMigrationPostgresTest']:
              relevant = [l for l in lines if marker in l]
              print('Sanitized API category:', marker,
                    'duplicate_migration' if any('Duplicate Flyway migration' in l for l in relevant) else
                    'docker_unavailable' if any('Docker' in l or 'docker' in l for l in relevant) else
                    'database_migration' if any('Migration' in l or 'flyway' in l.lower() for l in relevant) else
                    'unknown')
          if any('Could not find a valid Docker environment' in l for l in lines):
              print('Sanitized API: Docker environment unavailable')
          if any('Multiple resources found' in l or 'Duplicate Flyway migration' in l for l in lines):
              print('Sanitized API: duplicate migration resource')
          for l in lines:
              if 'FlywayMigrationIntegrationTest' in l and ('AssertionFailedError' in l or 'expected:' in l):
                  print('Sanitized API: migration_integrity_assertion')
          for l in errors:
              if 'Tests run:' in l:
                  test = re.search(r'(?:-- in |- in )([A-Za-z0-9_.$]+)', l)
                  if test:
                      counts = re.search(r'Tests run: ([0-9]+), Failures: ([0-9]+), Errors: ([0-9]+)', l)
                      if counts:
                          print('Test class:',test.group(1),'runs/failures/errors:',*counts.groups())
          for l in errors[:30]:
              if re.search(r'\.java:\[\d+,\d+\]',l):
                  match = re.search(r'([A-Za-z0-9_]+\.java):\[(\d+),(\d+)\]',l)
                  if match:
                      print('Compiler location:',match.group(1),match.group(2),match.group(3))
              elif re.search(r'Tests run:|There are test failures|Failed to execute goal|COMPILATION ERROR',l):
                  print('Maven marker:',re.split(r'[:(]',l.replace('[ERROR]','').strip(),maxsplit=1)[0][:120])
          PY
            exit 1
          fi
          echo "Private API tests passed."

      - name: Login Azure using public deploy repository DEV OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Confirm official destination and derive TLS-valid private API origin
        env:
          EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          EXPECTED_TENANT: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          rg=rg-coderats-migration-c26m0911
          registry=crcoderatsmigc26m0911
          cae=cae-coderatsmig-wp-c26m0911
          api=ca-cdmstd-api-c26m0911
          web=ca-cdmstd-web-c26m0911
          grader=ca-cdmstd-grader-c26m0911
          # Explicit allowlisting prevents accidental deployment into the exhausted legacy subscription.
          [[ "$EXPECTED_SUBSCRIPTION" == "da3650a9-e291-43f1-ae4b-9dcc8ff84239" ]] || exit 1
          [[ "$EXPECTED_TENANT" == "1cf74c7e-fcd9-46f7-8a9d-e699d3529003" ]] || exit 1
          [[ "$(az account show --query id -o tsv)" == "$EXPECTED_SUBSCRIPTION" ]] || exit 1
          [[ "$(az account show --query tenantId -o tsv)" == "$EXPECTED_TENANT" ]] || exit 1
          [[ "$(az group show -n "$rg" --query name -o tsv)" == "$rg" ]] || exit 1
          [[ "$(az acr show -g "$rg" -n "$registry" --query loginServer -o tsv)" == "$registry.azurecr.io" ]] || exit 1
          domain="$(az containerapp env show -g "$rg" -n "$cae" --query properties.defaultDomain -o tsv)"
          [[ "$domain" == "victoriousocean-99a629e7.brazilsouth.azurecontainerapps.io" ]] || exit 1
          api_fqdn="$(az containerapp show -g "$rg" -n "$api" --query properties.configuration.ingress.fqdn -o tsv)"
          api_external="$(az containerapp show -g "$rg" -n "$api" --query properties.configuration.ingress.external -o tsv)"
          web_fqdn="$(az containerapp show -g "$rg" -n "$web" --query properties.configuration.ingress.fqdn -o tsv)"
          web_external="$(az containerapp show -g "$rg" -n "$web" --query properties.configuration.ingress.external -o tsv)"
          grader_fqdn="$(az containerapp show -g "$rg" -n "$grader" --query properties.configuration.ingress.fqdn -o tsv)"
          grader_external="$(az containerapp show -g "$rg" -n "$grader" --query properties.configuration.ingress.external -o tsv)"
          grader_image="$(az containerapp show -g "$rg" -n "$grader" --query properties.template.containers[0].image -o tsv)"
          grader_latest="$(az containerapp show -g "$rg" -n "$grader" --query properties.latestRevisionName -o tsv)"
          grader_ready="$(az containerapp show -g "$rg" -n "$grader" --query properties.latestReadyRevisionName -o tsv)"
          [[ "$api_fqdn" == "$api.internal.$domain" ]] || exit 1
          [[ "$api_external" == "false" || "$api_external" == "False" ]] || exit 1
          [[ "$web_fqdn" == "$web.$domain" ]] || exit 1
          [[ "$web_external" == "true" || "$web_external" == "True" ]] || exit 1
          [[ "$grader_fqdn" == "$grader.internal.$domain" ]] || { echo "::error::Official private Grader hostname mismatch"; exit 1; }
          [[ "$grader_external" == "false" || "$grader_external" == "False" ]] || { echo "::error::Grader ingress must remain private"; exit 1; }
          [[ "$grader_image" == "$registry.azurecr.io/api-grader-coderats:"* || "$grader_image" == "$registry.azurecr.io/api-grader-coderats@sha256:"* ]] || { echo "::error::Unexpected Grader image"; exit 1; }
          [[ -n "$grader_latest" && "$grader_latest" == "$grader_ready" ]] || { echo "::error::Official Grader revision not ready"; exit 1; }
          echo "TARGET_API_ORIGIN=https://$api_fqdn" >> "$GITHUB_ENV"
          echo "TARGET_GRADER_ORIGIN=https://$grader_fqdn" >> "$GITHUB_ENV"
          echo "TARGET_WEB_ORIGIN=https://$web_fqdn" >> "$GITHUB_ENV"
          echo "Official Web and private API verified in the new Azure subscription." >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to destination ACR without leaking credentials
        run: |
          set -euo pipefail
          registry=crcoderatsmigc26m0911
          if az acr login -n "$registry" --only-show-errors --output none >"$RUNNER_TEMP/acr-auth.log" 2>&1; then
            echo "Destination ACR login successful."
            exit 0
          fi
          # Existing migration workflows use destination-only scoped ACR tokens.
          token=coderats-official-release-push
          if ! az acr token show -r "$registry" -n "$token" --only-show-errors --query name -o tsv >/dev/null 2>&1; then
            az acr token create -r "$registry" -n "$token" --scope-map _repositories_push --no-passwords \
              --only-show-errors -o none >"$RUNNER_TEMP/acr-auth.log" 2>&1 || {
              echo "::error::Destination registry push token could not be created"; exit 1;
            }
          fi
          az acr token update -r "$registry" -n "$token" --status enabled --only-show-errors -o none \
            >"$RUNNER_TEMP/acr-auth.log" 2>&1 || exit 1
          secret="$(az acr token credential generate -r "$registry" -n "$token" --password1 \
            --expiration-in-days 1 --query 'passwords[0].value' -o tsv --only-show-errors 2>"$RUNNER_TEMP/acr-auth.log")"
          [[ -n "$secret" && "$secret" != "None" ]] || {
            echo "::error::No destination registry push credential available"; exit 1;
          }
          echo "::add-mask::$secret"
          printf '%s' "$secret" | docker login "$registry.azurecr.io" --username "$token" \
            --password-stdin >"$RUNNER_TEMP/acr-auth.log" 2>&1 || {
            echo "::error::Destination ACR login failed"; exit 1;
          }
          unset secret

      - name: Build and release source image only to new CodeRats Container App
        if: env.DEPLOY_SERVICE == 'web' || env.DEPLOY_SERVICE == 'api'
        env:
          SERVICE: ${{ env.DEPLOY_SERVICE }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          rg=rg-coderats-migration-c26m0911
          registry=crcoderatsmigc26m0911
          if [[ "$SERVICE" == web ]]; then
            app=ca-cdmstd-web-c26m0911
            image_repo=web-coderats-base
          else
            app=ca-cdmstd-api-c26m0911
            image_repo=api-coderats-base
          fi
          current="$(az containerapp show -g "$rg" -n "$app" --query properties.template.containers[0].image -o tsv)"
          [[ "$current" == "$registry.azurecr.io/$image_repo:"* || "$current" == "$registry.azurecr.io/$image_repo@sha256:"* ]] || {
            echo "::error::Unexpected image repository on official service; refusing to replace it"; exit 1;
          }
          image="$registry.azurecr.io/$image_repo:$SOURCE_SHA-$GITHUB_RUN_ID"
          runlog="$RUNNER_TEMP/private-official-build.log"
          if [[ "$SERVICE" == web ]]; then
            if ! docker build -f app-src/Dockerfile \
                --build-arg "NEXT_PUBLIC_API_URL=https://coderats.club" \
                --build-arg "API_PROXY_TARGET=$TARGET_API_ORIGIN" -t "$image" app-src >"$runlog" 2>&1; then
              echo "::error::Private Web build failed; raw output withheld"; exit 1;
            fi
          else
            if ! docker build -f app-src/Dockerfile -t "$image" app-src >"$runlog" 2>&1; then
              echo "::error::Private API build failed; raw output withheld"; exit 1;
            fi
          fi
          if ! docker push "$image" >"$runlog" 2>&1; then
            echo "::error::Private image push to new ACR failed; raw output withheld"; exit 1;
          fi
          if [[ "$SERVICE" == web ]]; then
            az containerapp update -g "$rg" -n "$app" --image "$image" \
              --set-env-vars "API_PROXY_TARGET=$TARGET_API_ORIGIN" "NEXT_PUBLIC_API_URL=https://coderats.club" \
              --only-show-errors -o none >"$RUNNER_TEMP/private-official-update.log" 2>&1 || {
              echo "::error::Web revision update failed; raw output withheld"; exit 1;
            }
          else
            # Preserve GitHub App secrets, database, media and shared Grader token.
            # Repair the internal Grader origin and enable result synchronization.
            az containerapp update -g "$rg" -n "$app" --image "$image" \
              --set-env-vars \
                "FRONTEND_URL=https://coderats.club" \
                "GITHUB_OAUTH_REDIRECT_URI=https://coderats.club/login/oauth2/code/github" \
                "CORS_ALLOWED_ORIGINS=https://coderats.club,https://www.coderats.club" \
                "SERVER_SERVLET_SESSION_COOKIE_SECURE=true" \
                "GRADER_API_URL=$TARGET_GRADER_ORIGIN" \
                "GRADER_POLLING_ENABLED=true" \
              --only-show-errors -o none >"$RUNNER_TEMP/private-official-update.log" 2>&1 || {
              echo "::error::API revision update failed; raw output withheld"; exit 1;
            }
          fi
          for i in $(seq 1 45); do
            actual="$(az containerapp show -g "$rg" -n "$app" --query properties.template.containers[0].image -o tsv)"
            latest="$(az containerapp show -g "$rg" -n "$app" --query properties.latestRevisionName -o tsv)"
            ready="$(az containerapp show -g "$rg" -n "$app" --query properties.latestReadyRevisionName -o tsv)"
            if [[ "$actual" == "$image" && -n "$latest" && "$latest" == "$ready" ]]; then
              if [[ "$SERVICE" == api ]]; then
                effective_grader="$(az containerapp show -g "$rg" -n "$app" --query "properties.template.containers[0].env[?name=='GRADER_API_URL'].value | [0]" -o tsv)"
                effective_polling="$(az containerapp show -g "$rg" -n "$app" --query "properties.template.containers[0].env[?name=='GRADER_POLLING_ENABLED'].value | [0]" -o tsv)"
                [[ "$effective_grader" == "$TARGET_GRADER_ORIGIN" && "$effective_polling" == true ]] || { echo "::error::API Grader origin or polling configuration did not take effect"; exit 1; }
                echo "Private Grader origin and evaluation polling enabled on API revision." >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "Official Azure revision ready: $SERVICE" >> "$GITHUB_STEP_SUMMARY"
              echo "Private source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::New official Container App revision did not become ready"
          exit 1

      - name: Validate first-party auth routing after release
        if: env.DEPLOY_SERVICE == 'web' || env.DEPLOY_SERVICE == 'api'
        run: |
          set -euo pipefail
          [[ "$(curl --silent --show-error --location --max-time 15 -o /dev/null -w '%{http_code}' "$TARGET_WEB_ORIGIN/health")" == "200" ]] || {
            echo "::error::Official Azure Web health failed"; exit 1;
          }
          for origin in "$TARGET_WEB_ORIGIN" "https://coderats.club"; do
            status="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$origin/api/v1/auth/me")"
            [[ "$status" == "401" ]] || {
              echo "::error::Anonymous session probe failed at official origin"; exit 1;
            }
          done
          # Never print OAuth state, GitHub redirect URL or cookies to public logs.
          curl --silent --show-error --max-time 15 -D "$RUNNER_TEMP/oauth-headers-private.txt" \
            -o /dev/null "https://coderats.club/oauth2/authorization/github"
          python3 - <<'PY'
          import pathlib, urllib.parse, sys
          s=pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'oauth-headers-private.txt').read_text()
          lines=s.splitlines()
          status=next((l for l in lines if l.startswith('HTTP/')), '')
          location=next((l.split(':',1)[1].strip() for l in lines if l.lower().startswith('location:')), '')
          u=urllib.parse.urlsplit(location)
          q=urllib.parse.parse_qs(u.query)
          if not ((' 302 ' in status or ' 303 ' in status) and u.hostname=='github.com'
                  and u.path=='/login/oauth/authorize'
                  and q.get('redirect_uri')==['https://coderats.club/login/oauth2/code/github']
                  and bool(q.get('state'))):
            sys.exit('::error::GitHub OAuth callback routing is not ready')
          print('First-party OAuth initiation and target callback verified.')
          PY
          echo "Canonical domain proxy, anonymous session and OAuth redirect verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove cloned private sources and logout
        if: always()
        run: |
          rm -rf app-src || true
          az logout >/dev/null 2>&1 || true

