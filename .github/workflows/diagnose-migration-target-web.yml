name: Diagnose CodeRats migration-target Web and existing apps (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-migration-target-web.yml"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: coderats-migration-target-web-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'coderats-hub/coderats-deploy' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, 'ci(migration): diagnose target web'))
    runs-on: ubuntu-latest
    environment: migration-target
    timeout-minutes: 20
    env:
      SID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TID: ${{ secrets.AZURE_TENANT_ID }}
      RG: rg-coderats-migration-c26m0911
      CAE: cae-coderatsmig-c26m0911
      ACR: crcoderatsmigc26m0911
      WEB: ca-coderatsmig-web-c26m0911
      API: ca-coderatsmig-api-c26m0911
      GRADER: ca-coderatsmig-grader-c26m0911
    steps:
      - name: Authenticate only to the new Azure for Students subscription
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target and inspect public-safe Container App metadata only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SID" == "da3650a9-e291-43f1-ae4b-9dcc8ff84239" ]]
          [[ "$TID" == "1cf74c7e-fcd9-46f7-8a9d-e699d3529003" ]]
          [[ "$(az account show --query id -o tsv)" == "$SID" ]]
          [[ "$(az account show --query tenantId -o tsv)" == "$TID" ]]
          az group show --subscription "$SID" -n "$RG" --query name -o tsv --only-show-errors >/dev/null
          domain="$(az containerapp env show --subscription "$SID" -g "$RG" -n "$CAE" --query properties.defaultDomain -o tsv --only-show-errors)"
          [[ "$domain" == *.azurecontainerapps.io ]]
          {
            echo '### Isolated migration-target Container Apps diagnostic'
            echo '- Destination subscription and tenant: verified'
            echo '- Operation: read-only; no DEV resources, secrets, user data, or database rows accessed'
          } >> "$GITHUB_STEP_SUMMARY"
          for app in "$GRADER" "$API" "$WEB"; do
            if az containerapp show --subscription "$SID" -g "$RG" -n "$app" --query name -o tsv --only-show-errors >/dev/null 2>&1; then
              status="$(az containerapp show --subscription "$SID" -g "$RG" -n "$app" --query properties.runningStatus -o tsv --only-show-errors 2>/dev/null || echo unavailable)"
              echo "- $app: exists; ARM runningStatus=$status" >> "$GITHUB_STEP_SUMMARY"
              az containerapp revision list --subscription "$SID" -g "$RG" -n "$app" \
                --query '[].{name:name,health:properties.healthState,running:properties.runningState,active:properties.active}' \
                --only-show-errors -o json > "$RUNNER_TEMP/revisions.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/revisions.json"
              python3 - <<'PY'
          import json,os
          r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"revisions.json")))
          if not isinstance(r,list): r=[]
          ok={"Healthy","Running","Provisioned","True","False","Unknown","None"}
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"  - Revisions observed: {len(r)}\n")
              for x in r[-3:]:
                  health=str(x.get("health","unknown"))
                  running=str(x.get("running","unknown"))
                  f.write(f"  - Revision health: {health if health in ok else 'other'} / {running if running in ok else 'other'}\n")
          PY
            else
              echo "- $app: absent (no Container App ARM resource)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if az containerapp show --subscription "$SID" -g "$RG" -n "$WEB" --query name -o tsv --only-show-errors >/dev/null 2>&1; then
            fqdn="$(az containerapp show --subscription "$SID" -g "$RG" -n "$WEB" --query properties.configuration.ingress.fqdn -o tsv --only-show-errors 2>/dev/null || true)"
            if [[ "$fqdn" == *.azurecontainerapps.io ]]; then
              echo "- Web public endpoint: https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
              code="$(curl -L -sS -o /dev/null --connect-timeout 7 --max-time 18 -w '%{http_code}' "https://$fqdn/health" 2>/dev/null || true)"
              [[ "$code" =~ ^[0-9]{3}$ ]] || code="unavailable"
              echo "- Web /health HTTP status: $code" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "- Expected Web origin based on CAE default domain: https://$WEB.$domain" >> "$GITHUB_STEP_SUMMARY"
          echo 'No raw app configuration or logs were printed.'
          cat "$GITHUB_STEP_SUMMARY"

      - name: Inspect recent Web ARM activity and report only allowlisted error codes
        shell: bash
        run: |
          set -euo pipefail
          if az monitor activity-log list --subscription "$SID" --resource-group "$RG" \
            --offset 4h --max-events 100 --only-show-errors -o json > "$RUNNER_TEMP/mirror-arm-events.json" 2>/dev/null; then
            python3 - <<'PY'
          import json,os,re
          records=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"mirror-arm-events.json")))
          if not isinstance(records,list): records=[]
          web=os.environ["WEB"].casefold()
          matches=[]
          categories=[]
          for x in records:
              res=str(x.get("resourceId") or x.get("resourceUri") or "").casefold()
              if not (res.endswith("/containerapps/"+web) or res.endswith("/containerapps/"+web+"/write")):
                  continue
              status=x.get("status") or {}
              sub=x.get("subStatus") or {}
              def safe_state(v):
                  s=str(v.get("value","") if isinstance(v,dict) else v)
                  return s if re.fullmatch(r"[A-Za-z0-9_.-]{1,48}",s) else "other"
              msg=(x.get("properties") or {}).get("statusMessage") or ""
              if isinstance(msg,dict):
                  payload=msg
              else:
                  try: payload=json.loads(msg)
                  except (ValueError,TypeError): payload={}
              def code_from(v):
                  if isinstance(v,dict):
                      if isinstance(v.get("error"),dict): return code_from(v["error"])
                      return v.get("code") or ""
                  return ""
              code=code_from(payload)
              if not isinstance(code,str) or not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]{1,62}",code): code="unavailable"
              matches.append((str(x.get("eventTimestamp") or "")[:20],safe_state(status),safe_state(sub),code))
              # Categorize only; never emit raw ARM error messages (may contain sensitive details).
              raw_msg=str(msg).lower()
              category="unspecified"
              if any(w in raw_msg for w in ("quota","maximum allowed cores","limit reached")): category="quota"
              elif any(w in raw_msg for w in ("capacity","resource not available","regional allocation")): category="capacity"
              elif any(w in raw_msg for w in ("imagepull","image pull","manifest unknown","invalid image","image not found")): category="image-pull"
              elif any(w in raw_msg for w in ("registry","acrpull","unauthorized")): category="registry-auth"
              elif any(w in raw_msg for w in ("policy","disallowed","allowed locations")): category="azure-policy"
              elif any(w in raw_msg for w in ("already exists","conflict")): category="conflict"
              categories.append(category)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Recent Web Azure Resource Manager events\n")
              if not matches: f.write("- No Web-specific ARM events found in the available four-hour window\n")
              else:
                  for (time,status,sub,code),category in zip(matches[-10:],categories[-10:]):
                      t=time if re.fullmatch(r"[0-9TZ:.-]{1,20}",time) else "unknown"
                      f.write(f"- {t}: status={status}, subStatus={sub}, errorCode={code}, causeCategory={category}\n")
          PY
          else
            echo '- ARM activity event query: unavailable (no raw diagnostics exposed)' >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"

      - name: Inspect destination environment Container Apps quotas (read-only)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SID" == "da3650a9-e291-43f1-ae4b-9dcc8ff84239" ]]
          if az containerapp env list-usages --subscription "$SID" \
            -g "$RG" -n "$CAE" --only-show-errors -o json \
            > "$RUNNER_TEMP/mirror-quota-data.json" 2>/dev/null; then
            python3 - <<'PY'
          import json,os,re
          p=os.path.join(os.environ["RUNNER_TEMP"],"mirror-quota-data.json")
          v=json.load(open(p))
          if isinstance(v,dict): v=v.get("value",v.get("usages",[]))
          if not isinstance(v,list): v=[]
          safe=lambda x: str(x) if re.fullmatch(r"[A-Za-z0-9 _./()-]{1,85}",str(x)) else "unavailable"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Destination Container Apps environment quotas\n")
              if not v: f.write("- No per-environment quota records returned\n")
              for x in v[:30]:
                  if not isinstance(x,dict): continue
                  n=x.get("name",{})
                  n=(n.get("localizedValue") or n.get("value","")) if isinstance(n,dict) else n
                  c=x.get("currentValue",x.get("currentUsage",""))
                  l=x.get("limit",x.get("maximum",""))
                  if not isinstance(c,(int,float)) or not isinstance(l,(int,float)): continue
                  f.write("- "+safe(n)+": usage="+str(c)+"; limit="+str(l)+"\n")
          PY
          else
            echo "### Destination Container Apps environment quotas" >> "$GITHUB_STEP_SUMMARY"
            echo "- Azure CLI quota query unavailable; no failure details published" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/mirror-quota-data.json"

      - name: Inspect regional app quotas and expected Web image tag (read-only)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SID" == "da3650a9-e291-43f1-ae4b-9dcc8ff84239" ]]
          if az containerapp list-usages --location brazilsouth --subscription "$SID" \
              --only-show-errors -o json > "$RUNNER_TEMP/mirror-region-quota.json" 2>/dev/null; then
            python3 - <<'PY'
          import json,os,re
          p=os.path.join(os.environ["RUNNER_TEMP"],"mirror-region-quota.json")
          v=json.load(open(p))
          if isinstance(v,dict): v=v.get("value",[])
          if not isinstance(v,list): v=[]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Destination Container Apps regional usage\n")
              for x in v[:40]:
                  if not isinstance(x,dict): continue
                  name=x.get("name",{})
                  name=name.get("value","") if isinstance(name,dict) else name
                  current=x.get("currentValue"); limit=x.get("limit")
                  if not re.fullmatch(r"[A-Za-z0-9_. -]{1,65}",str(name)): continue
                  if not isinstance(current,(float,int)) or not isinstance(limit,(float,int)): continue
                  f.write(f"- {name}: {current}/{limit}\n")
              if not v: f.write("- No regional quota entries returned\n")
          PY
          else
            echo "- Regional Container Apps quota query unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi
          if tag="$(az acr repository show-tags --name "$ACR" --repository web-coderats-base \
              --subscription "$SID" --query "[?@=='mirror-db35f8c2f5fb'] | [0]" \
              --only-show-errors -o tsv 2>/dev/null)"; then
            if [[ "$tag" == "mirror-db35f8c2f5fb" ]]; then
              echo "- Expected destination Web ACR tag: confirmed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Expected destination Web ACR tag: not found in accessible listing" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- Expected destination Web ACR tag: registry listing unavailable under this identity" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/mirror-region-quota.json"

      - name: Inspect correlation IDs and nested ARM failure codes without raw error messages
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SID" == "da3650a9-e291-43f1-ae4b-9dcc8ff84239" ]]
          [[ "$TID" == "1cf74c7e-fcd9-46f7-8a9d-e699d3529003" ]]
          [[ "$(az account show --query id -o tsv)" == "$SID" ]]
          file="$RUNNER_TEMP/mirror-web-arm-correlation.json"
          if az monitor activity-log list --subscription "$SID" --resource-group "$RG" \
              --offset 24h --max-events 300 --only-show-errors -o json > "$file" 2>/dev/null; then
            python3 - <<'PY'
          import json,os,re
          p=os.path.join(os.environ["RUNNER_TEMP"],"mirror-web-arm-correlation.json")
          rows=json.load(open(p))
          if not isinstance(rows,list): rows=[]
          web="/providers/microsoft.app/containerapps/"+os.environ["WEB"].casefold()
          uuid=re.compile(r"^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$",re.I)
          codepat=re.compile(r"^[a-z][a-z0-9_.-]{1,80}$",re.I)
          matches=[]
          def state(v):
              if isinstance(v,dict): v=v.get("value","")
              s=str(v)
              return s if re.fullmatch(r"[a-z][a-z0-9_-]{1,36}",s,re.I) else "unavailable"
          def nested_codes(obj):
              result=[]
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      if k=="code" and isinstance(v,str) and codepat.fullmatch(v):
                          result.append(v)
                      elif isinstance(v,(dict,list)):
                          result.extend(nested_codes(v))
              elif isinstance(obj,list):
                  for v in obj: result.extend(nested_codes(v))
              return list(dict.fromkeys(result))[:8]
          for x in rows:
              res=str(x.get("resourceId") or x.get("resourceUri") or "").casefold()
              if not (res.endswith(web) or res.endswith(web+"/write")): continue
              prop=x.get("properties") or {}
              msg=prop.get("statusMessage") or ""
              try: obj=json.loads(msg) if isinstance(msg,str) else msg
              except (ValueError,TypeError): obj={}
              if not isinstance(obj,(dict,list)): obj={}
              codes=nested_codes(obj)
              raw=str(msg).casefold()
              categories={
                "quota":("quota","limit reached","maximum allowed cores","subscriptioncores"),
                "regional-capacity":("insufficient capacity","regional allocation","capacity exhausted"),
                "image":("imagepull","image pull","manifest unknown","image not found"),
                "registry-access":("registry","acr pull","acrpull","unauthorized"),
                "policy":("policy","disallowed","allowed locations"),
                "network":("vnet","subnet","network","ingress","dns"),
                "managed-identity":("managedidentity","userassignedidentity","identity"),
                "resource-conflict":("conflict","already exists"),
                "invalid-input":("invalid","parameter","malformed","validation"),
              }
              hints=[k for k,terms in categories.items() if any(t in raw for t in terms)]
              event=x.get("eventTimestamp","")
              event=event[:19] if re.fullmatch(r"[0-9TZ:.-]{19,40}",str(event)) else "unknown"
              corr=x.get("correlationId","")
              corr=corr if isinstance(corr,str) and uuid.fullmatch(corr) else "not-available"
              event_id=x.get("eventDataId","")
              event_id=event_id if isinstance(event_id,str) and uuid.fullmatch(event_id) else "not-available"
              op=x.get("operationName") or {}
              op=op.get("value","") if isinstance(op,dict) else op
              op="containerApps/write" if str(op).casefold()=="microsoft.app/containerapps/write" else "other"
              matches.append({"time":event,"status":state(x.get("status")),"sub":state(x.get("subStatus")),
                              "op":op,"corr":corr,"event_id":event_id,"codes":codes,"hints":hints})
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Web provisioning failures: target ARM correlation IDs\n")
              f.write("- This summary contains **only** codes, UUID correlation IDs and coarse categories; no raw messages or secrets\n")
              if not matches: f.write("- No Web-specific events visible in the 24-hour query window\n")
              for x in sorted(matches,key=lambda x:x["time"])[-15:]:
                  f.write("- "+x["time"]+" | status="+x["status"]+" | sub="+x["sub"]+
                          " | operation="+x["op"]+" | correlationId="+x["corr"]+
                          " | eventDataId="+x["event_id"]+" | nestedCodes="+
                          (",".join(x["codes"]) or "none")+" | matchedHints="+
                          (",".join(x["hints"]) or "none")+"\n")
          PY
            cat "$GITHUB_STEP_SUMMARY"
          else
            echo "ARM correlation query unavailable (no raw logs emitted)." >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$file"

      - name: Inspect ARM provider and resource-group deployment failure metadata (read-only)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SID" == "da3650a9-e291-43f1-ae4b-9dcc8ff84239" ]]
          reg="$(az provider show -n Microsoft.App --subscription "$SID" --query registrationState -o tsv --only-show-errors 2>/dev/null || true)"
          [[ "$reg" =~ ^[A-Za-z]{2,30}$ ]] || reg="unavailable"
          echo "- Microsoft.App provider registration: $reg" >> "$GITHUB_STEP_SUMMARY"
          envstate="$(az containerapp env show -g "$RG" -n "$CAE" --subscription "$SID" --query properties.provisioningState -o tsv --only-show-errors 2>/dev/null || true)"
          [[ "$envstate" =~ ^[A-Za-z]{2,30}$ ]] || envstate="unavailable"
          echo "- Target Container Apps environment provisioning: $envstate" >> "$GITHUB_STEP_SUMMARY"
          if az deployment group list --subscription "$SID" -g "$RG" --only-show-errors -o json \
              > "$RUNNER_TEMP/mirror-group-deployments.json" 2>/dev/null; then
            python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ["RUNNER_TEMP"],"mirror-group-deployments.json")
          items=json.load(open(p))
          if not isinstance(items,list): items=[]
          failed=[x for x in items if (x.get("properties") or {}).get("provisioningState")=="Failed"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("- Failed resource-group deployments currently recorded: "+str(len(failed))+"\n")
              f.write("- No template, inputs, deployment parameters or deployment outputs collected\n")
          PY
          else
            echo "- Resource-group deployment list unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/mirror-group-deployments.json"

      - name: Print safe summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$GITHUB_STEP_SUMMARY" ]]; then cat "$GITHUB_STEP_SUMMARY"; fi
          rm -f "$RUNNER_TEMP/revisions.json" "$RUNNER_TEMP/mirror-arm-events.json"
          az logout --output none >/dev/null 2>&1 || true
