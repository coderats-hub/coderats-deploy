name: Deploy CodeRats private services to DEV

# This repository is the actual workflow owner and dispatcher.
# No workflow is called from a private repository.
on:
  # Explicitly authorized beta4 API release after milestone/test reconciliation.
  # CodeRats authenticated member search endpoint for dashboard discovery.
  # Release: verified member mentions and notification schema parity for H2 and PostgreSQL.
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-private-dev.yml"
  schedule:
    # Public hosted runner dispatches the isolated, bounded DEV GET job.
    # This keeps new check-ins and completed assessments in sync.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      service:
        description: Select the private CodeRats service
        required: true
        type: choice
        options:
          - web
          - api
          - get-worker
      confirmation:
        description: Type DEPLOY_DEV to authorize this release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: "coderats-central-dev-${{ github.event_name == 'push' && github.event.head_commit.message == 'ci(dev): publish proficiency badges web' && 'web' || github.event_name == 'push' && github.event.head_commit.message == 'ci(dev): publish beta4 api' && 'api' || (github.event_name == 'push' || github.event_name == 'schedule') && 'get-worker' || inputs.service }}"
  cancel-in-progress: false

jobs:
  deploy:
    name: "Build and release ${{ github.event_name == 'push' && github.event.head_commit.message == 'ci(dev): publish proficiency badges web' && 'web' || github.event_name == 'push' && github.event.head_commit.message == 'ci(dev): publish beta4 api' && 'api' || (github.event_name == 'push' || github.event_name == 'schedule') && 'get-worker' || inputs.service }} (private source)"
    if: >-
      github.repository == 'coderats-hub/coderats-deploy' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'push' &&
        (github.event.head_commit.message == 'ci(dev): publish proficiency badges web' ||
         github.event.head_commit.message == 'ci(dev): publish beta4 api' ||
          github.event.head_commit.message == 'ci(dev): verify GET worker')))
    environment: dev
    # The CodeRats deployment tooling lives in this public repository.
    # Only trusted manual releases from protected main / environment dev may
    # build the related CodeRats applications; never accept untrusted refs.
    # GitHub's public-repository runner usage policy still applies.
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DEPLOY_SERVICE: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci(dev): publish proficiency badges web' && 'web' || github.event_name == 'push' && github.event.head_commit.message == 'ci(dev): publish beta4 api' && 'api' || (github.event_name == 'push' || github.event_name == 'schedule') && 'get-worker' || inputs.service }}"
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate intent and constrain private checkout
        id: target
        env:
          SERVICE: ${{ env.DEPLOY_SERVICE }}
          CONFIRMATION: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'DEPLOY_DEV' || inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "DEPLOY_DEV" ]] || {
            echo "::error::Confirmation must be DEPLOY_DEV"; exit 1;
          }
          case "$SERVICE" in
            web)        repo=web-coderats-base; branch=develop ;;
            api)        repo=api-coderats-base; branch=develop ;;
            get-worker) repo=coderats-base-infra; branch=main ;;
            *) echo "::error::Invalid service"; exit 1 ;;
          esac
          echo "repo_name=$repo" >> "$GITHUB_OUTPUT"
          echo "repo=coderats-hub/$repo" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Check required protected DEV credentials before private checkout
        env:
          GITHUB_APP_ID: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          GITHUB_APP_KEY: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for key in GITHUB_APP_ID GITHUB_APP_KEY AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!key}" ]] || { echo "::error::Missing DEV environment configuration: $key"; exit 1; }
          done

      - name: Issue short-lived GitHub App token for exactly one private repo
        id: private-token
        if: env.DEPLOY_SERVICE != 'get-worker'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODERATS_DEPLOY_APP_ID }}
          private-key: ${{ secrets.CODERATS_DEPLOY_APP_PRIVATE_KEY }}
          owner: coderats-hub
          repositories: ${{ steps.target.outputs.repo_name }}
          permission-contents: read

      - name: Checkout the PRIVATE source from its trusted branch
        uses: actions/checkout@v4
        if: env.DEPLOY_SERVICE != 'get-worker'
        with:
          repository: ${{ steps.target.outputs.repo }}
          ref: ${{ steps.target.outputs.branch }}
          token: ${{ steps.private-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 1
          path: app-src

      - name: Record the private source SHA for reproducible image tag
        id: source
        if: env.DEPLOY_SERVICE != 'get-worker'
        run: |
          set -euo pipefail
          sha="$(git -C app-src rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Prepare Node 24 for private web checks
        if: env.DEPLOY_SERVICE == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test and typecheck private frontend without publishing its logs
        if: env.DEPLOY_SERVICE == 'web'
        working-directory: app-src
        env:
          NEXT_PUBLIC_API_URL: https://coderats.club
          API_PROXY_TARGET: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          [[ "$NEXT_PUBLIC_API_URL" == https://* ]] || { echo "::error::Missing valid DEV API origin"; exit 1; }
          runlog="${RUNNER_TEMP}/coderats-web-checks.log"
          # Do not reveal private test output in this public repository.
          # Expose only which verification stage failed.
          if ! npm ci --no-audit --no-fund >"$runlog" 2>&1; then
            echo "::error::Private web validation failed: dependency installation."
            exit 1
          fi
          if ! npm test >"$runlog" 2>&1; then
            echo "::error::Private web validation failed: unit tests."
            exit 1
          fi
          if ! npx tsc --noEmit >"$runlog" 2>&1; then
            echo "::error::Private web validation failed: TypeScript."
            python3 - "$runlog" <<'PY'
          import pathlib, re, sys
          content = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          codes = re.findall(r"error (TS[0-9]+)", content)
          print("Sanitized TypeScript error counts:", {k: codes.count(k) for k in sorted(set(codes))})
          PY
            exit 1
          fi
          if ! npm run build -- --webpack >"$runlog" 2>&1; then
            echo "::error::Private web validation failed: Next build."
            exit 1
          fi
          echo "Private frontend validation passed."

      - name: Prepare Java 21 for private API checks
        if: env.DEPLOY_SERVICE == 'api'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify private API without publishing test output
        if: env.DEPLOY_SERVICE == 'api'
        working-directory: app-src
        run: |
          set -euo pipefail
          runlog="${RUNNER_TEMP}/coderats-api-checks.log"
          if ! (chmod +x mvnw && ./mvnw --batch-mode verify) >"$runlog" 2>&1; then
            echo "::error::Private Java verification failed. Sanitized diagnostics follow."
            # Never print the raw Maven output from a private repository in
            # a public workflow. Only known Maven compiler/test markers are
            # surfaced, with paths and arbitrary failure messages omitted.
            python3 - "$runlog" <<'PY'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          errors = [l for l in lines if '[ERROR]' in l]
          kinds = {
              'compiler_error': sum(bool(re.search(r'\.java:\[\d+,\d+\]', x)) for x in errors),
              'test_failures': sum('Tests run:' in x or 'Failures:' in x for x in errors),
              'build_goal_failures': sum('Failed to execute goal' in x for x in errors),
          }
          print('Maven failure categories:', kinds)
          for category, term in [
              ('SQL_GRAMMAR', 'BadSqlGrammarException'),
              ('H2_SQL_SYNTAX', 'JdbcSQLSyntaxErrorException'),
              ('POSTGRES_SQL', 'PSQLException'),
              ('DATA_INTEGRITY', 'DataIntegrityViolationException'),
              ('EMPTY_RESULT', 'EmptyResultDataAccessException'),
              ('NULL_POINTER', 'NullPointerException'),
              ('INVALID_QUERY', 'InvalidDataAccessResourceUsageException'),
              ('FLYWAY', 'FlywayException'),
              ('APPLICATION_CONTEXT', 'Failed to load ApplicationContext'),
          ]:
              if any(term in l for l in lines):
                  print('Sanitized API error category:', category)

          # Strict diagnostic classification, no application log lines or private stack traces.
          for marker in ['FlywayMigrationIntegrationTest', 'GitHubTokenMigrationPostgresTest']:
              relevant = [l for l in lines if marker in l]
              print('Sanitized API category:', marker,
                    'duplicate_migration' if any('Duplicate Flyway migration' in l for l in relevant) else
                    'docker_unavailable' if any('Docker' in l or 'docker' in l for l in relevant) else
                    'database_migration' if any('Migration' in l or 'flyway' in l.lower() for l in relevant) else
                    'unknown')
          if any('Could not find a valid Docker environment' in l for l in lines):
              print('Sanitized API: Docker environment unavailable')
          if any('Multiple resources found' in l or 'Duplicate Flyway migration' in l for l in lines):
              print('Sanitized API: duplicate migration resource')
          for l in lines:
              if 'FlywayMigrationIntegrationTest' in l and ('AssertionFailedError' in l or 'expected:' in l):
                  print('Sanitized API: migration_integrity_assertion')
          for l in errors:
              if 'Tests run:' in l:
                  test = re.search(r'(?:-- in |- in )([A-Za-z0-9_.$]+)', l)
                  if test:
                      counts = re.search(r'Tests run: ([0-9]+), Failures: ([0-9]+), Errors: ([0-9]+)', l)
                      if counts:
                          print('Test class:',test.group(1),'runs/failures/errors:',*counts.groups())
          for l in errors[:30]:
              if re.search(r'\.java:\[\d+,\d+\]',l):
                  match = re.search(r'([A-Za-z0-9_]+\.java):\[(\d+),(\d+)\]',l)
                  if match:
                      print('Compiler location:',match.group(1),match.group(2),match.group(3))
              elif re.search(r'Tests run:|There are test failures|Failed to execute goal|COMPILATION ERROR',l):
                  print('Maven marker:',re.split(r'[:(]',l.replace('[ERROR]','').strip(),maxsplit=1)[0][:120])
          PY
            exit 1
          fi
          echo "Private API tests passed."

      - name: Login Azure using public deploy repository DEV OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm DEV Azure scope
        env:
          EXPECTED_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          [[ "$(az account show --query id -o tsv)" == "$EXPECTED_SUBSCRIPTION" ]] || exit 1
          az group show --name rg-coderats-base-dev --query name -o tsv >/dev/null
          [[ "$(az acr show -n crcoderatsbasedev9e0045 -g rg-coderats-base-dev --query loginServer -o tsv)" == "crcoderatsbasedev9e0045.azurecr.io" ]] || exit 1

      - name: Build private image and publish DEV container revision
        if: env.DEPLOY_SERVICE == 'web' || env.DEPLOY_SERVICE == 'api'
        env:
          SERVICE: ${{ env.DEPLOY_SERVICE }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          WEB_APP: ${{ vars.AZURE_WEB_CONTAINER_APP }}
          API_ORIGIN: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          rg=rg-coderats-base-dev
          registry=crcoderatsbasedev9e0045
          if [[ "$SERVICE" == "web" ]]; then
            [[ "$WEB_APP" =~ ^[a-z0-9-]+-dev$ ]] || { echo "::error::Missing DEV web Container App"; exit 1; }
            [[ "$WEB_APP" == *web* ]] || { echo "::error::DEV web app name must contain web"; exit 1; }
            [[ "$API_ORIGIN" == https://* ]] || exit 1
            app="$WEB_APP"; image_repo=web-coderats-base; endpoint=/health
          else
            app=ca-coderats-base-api-dev; image_repo=api-coderats-base; endpoint=/actuator/health
          fi
          az containerapp show -g "$rg" -n "$app" --query name -o tsv >/dev/null
          image="$registry.azurecr.io/$image_repo:$SOURCE_SHA-$GITHUB_RUN_ID"
          az acr login -n "$registry" --output none
          runlog="${RUNNER_TEMP}/coderats-image-build.log"
          if [[ "$SERVICE" == "web" ]]; then
            if ! docker build -f app-src/Dockerfile --build-arg "NEXT_PUBLIC_API_URL=https://coderats.club" --build-arg "API_PROXY_TARGET=$API_ORIGIN" -t "$image" app-src >"$runlog" 2>&1; then
              echo "::error::Private web Docker build failed; inspect local runner log."; exit 1
            fi
          else
            if ! docker build -f app-src/Dockerfile -t "$image" app-src >"$runlog" 2>&1; then
              echo "::error::Private API Docker build failed; inspect local runner log."; exit 1
            fi
          fi
          docker push "$image" >"$runlog" 2>&1 || {
            echo "::error::Failed to push image to DEV ACR"; exit 1;
          }
          # FRONTEND_URL is the canonical OAuth success/failure return location,
          # not the API origin. Keep legacy DEV frontend in exact credentialed
          # CORS allowlist while users migrate bookmarks to coderats.club.
          # Keep session SameSite=Lax: durable auth also requires that the API
          # be bound to api.coderats.club (same-site), not just cross-site CORS.
          if [[ "$SERVICE" == "api" ]]; then
            az containerapp update -g "$rg" -n "$app" --image "$image" \
              --set-env-vars \
              "FRONTEND_URL=https://coderats.club" \
              "GITHUB_OAUTH_REDIRECT_URI=https://coderats.club/login/oauth2/code/github" \
              "CORS_ALLOWED_ORIGINS=https://coderats.club,https://www.coderats.club,https://ca-coderats-base-web-dev.wittyforest-08a02f79.eastus.azurecontainerapps.io" \
              --output none
          else
            az containerapp update -g "$rg" -n "$app" --image "$image" --output none
          fi
          fqdn="$(az containerapp show -g "$rg" -n "$app" --query properties.configuration.ingress.fqdn -o tsv)"
          [[ "$fqdn" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 1
          for i in $(seq 1 30); do
            actual="$(az containerapp show -g "$rg" -n "$app" --query properties.template.containers[0].image -o tsv)"
            latest="$(az containerapp show -g "$rg" -n "$app" --query properties.latestRevisionName -o tsv)"
            ready="$(az containerapp show -g "$rg" -n "$app" --query properties.latestReadyRevisionName -o tsv)"
            if [[ "$actual" == "$image" && -n "$latest" && "$latest" == "$ready" ]] &&
               curl --fail --silent --show-error --max-time 10 "https://$fqdn$endpoint" >/dev/null 2>&1; then
              if [[ "$SERVICE" == "api" ]]; then
                # Verify the deployed app, not merely build-time configuration.
                # Never print authentication/session headers into public logs.
                preflight="$(curl --fail --silent --show-error --max-time 12 \
                  -X OPTIONS "https://$fqdn/api/v1/auth/logout" \
                  -H "Origin: https://coderats.club" \
                  -H "Access-Control-Request-Method: POST" -D - -o /dev/null)" || exit 1
                if ! grep -Fqi "Access-Control-Allow-Origin: https://coderats.club" <<< "$preflight" ||
                   ! grep -Fqi "Access-Control-Allow-Credentials: true" <<< "$preflight"; then
                  echo "::error::coderats.club credentialed CORS preflight is not configured"
                  exit 1
                fi
                echo "Canonical frontend CORS preflight passed." >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "DEV ready: $SERVICE revision=$ready" >> "$GITHUB_STEP_SUMMARY"
              echo "Private commit deployed: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::DEV Container App revision is not healthy; inspect and roll back if needed"
          exit 1

      - name: Refresh and run isolated GET DEV worker after API release
        if: env.DEPLOY_SERVICE == 'get-worker' || env.DEPLOY_SERVICE == 'api'
        run: |
          set -euo pipefail
          rg=rg-coderats-base-dev
          registry=crcoderatsbasedev9e0045
          api=ca-coderats-base-api-dev
          job=caj-coderats-base-get-dev
          image="$(az containerapp show -g "$rg" -n "$api" --query properties.template.containers[0].image -o tsv)"
          [[ "$image" == "$registry.azurecr.io/api-coderats-base:"* ||
             "$image" == "$registry.azurecr.io/api-coderats-base@sha256:"* ]] || exit 1
          if [[ "$image" == *@sha256:* ]]; then
            digest="${image##*@}"
          else
            manifest="${image#"$registry.azurecr.io/"}"
            digest="$(az acr manifest show-metadata -r "$registry" -n "$manifest" --query digest -o tsv)"
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          immutable="$registry.azurecr.io/api-coderats-base@$digest"
          az containerapp job show -g "$rg" -n "$job" --query name -o tsv >/dev/null
          az containerapp job update -g "$rg" -n "$job" --container-name get-worker --image "$immutable" \
            --set-env-vars APP_RUNTIME_MODE=worker SPRING_PROFILES_ACTIVE=get-worker \
            GET_WORKER_ENABLED=true GET_BACKFILL_ENABLED=false GET_WORKER_RUN_ONCE=true \
            GET_WORKER_MAX_EVENTS=100 GET_WORKER_MAX_RUN_SECONDS=1200 \
            GET_BETA_ENABLED=true GET_BETA_ENVIRONMENT=dev \
            GET_BETA_ALLOWED_REPOSITORY_OWNER=coderats-hub GET_BETA_ALLOW_LEGACY_OAUTH=true \
            GET_BETA_POLICY_RELEASE=beta4-proficiency-quality --output none
          active="$(az containerapp job execution list -g "$rg" -n "$job" --query '[].properties.status' -o tsv)"
          if printf '%s\n' "$active" | grep -Eiq '^(Running|Pending|Processing)$'; then
            echo "Existing GET DEV batch active; skipped duplicate" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          execution="$(az containerapp job start -g "$rg" -n "$job" --query name -o tsv)"
          [[ "$execution" =~ ^[a-z0-9-]{4,80}$ ]] || {
            echo "::error::GET job did not return a valid execution name"; exit 1;
          }
          echo "GET DEV execution started with immutable API digest." >> "$GITHUB_STEP_SUMMARY"
          # Container Apps job start only acknowledges dispatch; it does not
          # prove the worker actually ran successfully. Check terminal state.
          for i in $(seq 1 145); do
            state="$(az containerapp job execution show -g "$rg" -n "$job" \
              --job-execution-name "$execution" --query properties.status -o tsv 2>/dev/null || true)"
            case "$state" in
              Succeeded)
                echo "GET DEV execution succeeded." >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              Failed|Stopped|Canceled|Cancelled)
                echo "::error::GET DEV worker execution did not succeed ($state)"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::GET DEV worker execution timed out without a confirmed terminal state"
          exit 1

      - name: Remove cloned private sources and logout
        if: always()
        run: |
          rm -rf app-src || true
          az logout >/dev/null 2>&1 || true
